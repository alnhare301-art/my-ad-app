<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميدان الروليت - التزامن المباشر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --royal-black: #050505; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--royal-black); color: white; overflow-x: hidden; }
        .gold-btn { background: linear-gradient(135deg, #D4AF37, #A67C00); color: black; font-weight: 900; transition: 0.3s; }
        .gold-btn:disabled { opacity: 0.3; }
        #ball { transition: transform 0.05s linear; }
    </style>
</head>
<body>

    <div class="max-w-lg mx-auto p-4 pb-20">
        <div class="flex justify-between items-center mb-6 bg-white/5 p-3 rounded-2xl border border-white/10">
            <div class="text-[var(--gold)] font-black text-xl italic">ARENA V4</div>
            <div class="flex items-center gap-2">
                <div class="bg-black/50 px-4 py-2 rounded-xl border border-[var(--gold)]/30">
                    <span id="balanceDisplay" class="text-[var(--gold)] font-bold">0</span> ⭐
                </div>
            </div>
        </div>

        <div class="bg-gradient-to-r from-yellow-900/20 to-black p-4 rounded-2xl mb-4 border border-yellow-600/20">
            <div class="flex justify-between items-center">
                <div>
                    <div id="statusLabel" class="text-yellow-500 font-black text-lg">تحديث البيانات...</div>
                    <div id="statusTimer" class="text-xs text-gray-400 font-mono">SYNC ACTIVE</div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-gray-500">اللاعبون المتصلون</div>
                    <div id="playerCount" class="text-3xl font-black text-white">0</div>
                </div>
            </div>
        </div>

        <div class="relative w-[300px] h-[300px] mx-auto rounded-3xl overflow-hidden border-4 border-white/10 bg-black shadow-2xl">
            <div id="ball" class="absolute w-5 h-5 bg-white rounded-full z-50 shadow-[0_0_15px_white]"></div>
            <div id="countdownOverlay" class="absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-md z-[60] hidden">
                <div id="bigTimer" class="text-8xl font-black text-[var(--gold)]"></div>
            </div>
            <canvas id="gameCanvas" width="600" height="600" class="w-full h-full"></canvas>
        </div>

        <div class="mt-6 space-y-4">
            <input type="number" id="betInput" value="1000" class="w-full bg-white/5 border-2 border-white/10 p-4 rounded-2xl text-center text-2xl font-black text-[var(--gold)] outline-none">
            <button id="joinBtn" class="gold-btn w-full py-5 rounded-2xl text-xl">انضمام للميدان ⚔️</button>
        </div>

        <div id="playersList" class="mt-6 space-y-2"></div>
        <button onclick="emergencyClear()" class="w-full mt-10 text-xs text-red-500/50 underline">تصفير السيرفر (في حال التعليق)</button>
    </div>

    <div id="winnerOverlay" class="fixed inset-0 bg-black/98 z-[1000] hidden flex-col items-center justify-center text-center p-6">
        <div id="winnerColorBox" class="w-32 h-32 rounded-3xl border-8 border-[var(--gold)] mb-6"></div>
        <div id="winnerName" class="text-4xl font-black text-white mb-2"></div>
        <div id="winnerPrize" class="text-6xl font-black text-yellow-500"></div>
    </div>

    <script>
        // أضفت random لمنع الـ Caching
        const DB_URL = "https://sarab-app-84448-default-rtdb.firebaseio.com/global_v6";
        const myId = localStorage.getItem("tg_id") || "U" + Math.floor(Math.random()*9999);
        localStorage.setItem("tg_id", myId);

        let myBal = parseInt(localStorage.getItem("bal")) || 100000;
        let players = [];
        let gameState = "waiting";
        let ballX = 140, ballY = 140, vX = 3, vY = 3;

        const ballElem = document.getElementById("ball");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function updateBal() {
            document.getElementById("balanceDisplay").innerText = myBal.toLocaleString();
            localStorage.setItem("bal", myBal);
        }
        updateBal();

        // فيزياء الكيرم المتطورة
        function moveBall() {
            if (gameState === "finished") return;
            ballX += vX; ballY += vY;
            if (ballX <= 0 || ballX >= 280) { vX *= -1; vY += (Math.random()-0.5); }
            if (ballY <= 0 || ballY >= 280) { vY *= -1; vX += (Math.random()-0.5); }
            ballElem.style.transform = `translate(${ballX}px, ${ballY}px)`;
            requestAnimationFrame(moveBall);
        }
        moveBall();

        // دالة التزامن الأساسية - تم تعديلها لضمان جلب بيانات جديدة دائماً
        async function sync() {
            try {
                // إضافة timestamp لمنع المتصفح من عرض بيانات قديمة
                const response = await fetch(`${DB_URL}.json?nocache=${Date.now()}`);
                const data = await response.json();
                
                if (!data) return;

                // تحديث الحالة واللاعبين
                gameState = data.state || "waiting";
                players = data.players ? Object.values(data.players) : [];

                document.getElementById("playerCount").innerText = players.length;
                drawArena();
                updateUI();

                // منطق العد التنازلي
                if (players.length >= 2 && gameState === "waiting") {
                    if (myId === players[0].id) {
                        await postData({ state: "counting", startAt: Date.now() });
                    }
                }

                if (gameState === "counting") {
                    const timer = 10 - Math.floor((Date.now() - data.startAt) / 1000);
                    if (timer <= 0) {
                        if (myId === players[0].id) {
                            await postData({ state: "playing", seed: Math.random() });
                        }
                    } else {
                        document.getElementById("bigTimer").innerText = timer;
                        document.getElementById("countdownOverlay").classList.remove("hidden");
                    }
                } else {
                    document.getElementById("countdownOverlay").classList.add("hidden");
                }

                if (gameState === "playing" && data.seed && !window.isSpinning) {
                    runFinalSpin(data.seed);
                }

            } catch (e) { console.error("Sync Error"); }
        }

        async function postData(obj) {
            await fetch(`${DB_URL}.json`, { method: 'PATCH', body: JSON.stringify(obj) });
        }

        function drawArena() {
            ctx.clearRect(0, 0, 600, 600);
            const total = players.reduce((s, p) => s + (p.amount || 0), 0);
            if (total === 0) return;
            let x=0, y=0, w=600, h=600;
            players.forEach((p, i) => {
                const ratio = p.amount / total;
                ctx.fillStyle = p.color;
                if(i % 2 === 0) {
                    let pw = (i === players.length - 1) ? w : w * ratio;
                    ctx.fillRect(x, y, pw, h);
                    p.box = {x1: x, y1: y, x2: x+pw, y2: y+h};
                    x += pw; w -= pw;
                } else {
                    let ph = (i === players.length - 1) ? h : h * ratio;
                    ctx.fillRect(x, y, w, ph);
                    p.box = {x1: x, y1: y, x2: x+w, y2: y+ph};
                    y += ph; h -= ph;
                }
            });
        }

        function updateUI() {
            document.getElementById("playersList").innerHTML = players.map(p => `
                <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border-r-8 mb-2" style="border-color: ${p.color}">
                    <span class="font-bold">${p.name} ${p.id === myId ? '(أنت)' : ''}</span>
                    <span class="text-yellow-500 font-black">${p.amount.toLocaleString()}</span>
                </div>
            `).join('');

            document.getElementById("statusLabel").innerText = 
                gameState === "waiting" ? (players.length < 2 ? "بانتظار لاعب آخر..." : "جاهزون؟") :
                gameState === "counting" ? "يغلق الرهان..." : "المعركة جارية!";
            
            document.getElementById("joinBtn").disabled = (gameState !== "waiting" && gameState !== "counting");
        }

        async function runFinalSpin(seed) {
            window.isSpinning = true;
            vX = Math.cos(seed * 10) * 20;
            vY = Math.sin(seed * 10) * 20;

            const loop = setInterval(() => {
                vX *= 0.98; vY *= 0.98;
                if (Math.abs(vX) < 0.2) {
                    clearInterval(loop);
                    window.isSpinning = false;
                    checkWinnerLocally();
                }
            }, 30);
        }

        function checkWinnerLocally() {
            const fx = (ballX + 10) * 2;
            const fy = (ballY + 10) * 2;
            const win = players.find(p => p.box && fx >= p.box.x1 && fx <= p.box.x2 && fy >= p.box.y1 && fy <= p.box.y2);
            if (win) showWinner(win);
        }

        function showWinner(w) {
            const prize = players.reduce((s, p) => s + p.amount, 0);
            document.getElementById("winnerName").innerText = w.name;
            document.getElementById("winnerPrize").innerText = "+" + prize.toLocaleString();
            document.getElementById("winnerColorBox").style.backgroundColor = w.color;
            document.getElementById("winnerOverlay").classList.remove("hidden");
            document.getElementById("winnerOverlay").classList.add("flex");

            if (w.id === myId && !window.rewarded) {
                myBal += prize; updateBal(); window.rewarded = true;
            }

            setTimeout(async () => {
                if (myId === players[0].id) {
                    await fetch(`${DB_URL}.json`, { method: 'PUT', body: JSON.stringify({ state: "waiting", players: {} }) });
                }
                location.reload();
            }, 5000);
        }

        document.getElementById("joinBtn").onclick = async () => {
            const amt = parseInt(document.getElementById("betInput").value);
            if (amt > myBal || amt < 100) return;
            myBal -= amt; updateBal();
            const pData = { id: myId, name: "لاعب_" + myId.substr(1,3), amount: amt, color: `hsl(${Math.random()*360}, 70%, 50%)` };
            await fetch(`${DB_URL}/players/${myId}.json`, { method: 'PUT', body: JSON.stringify(pData) });
        };

        async function emergencyClear() {
            await fetch(`${DB_URL}.json`, { method: 'PUT', body: JSON.stringify({ state: "waiting", players: {} }) });
            location.reload();
        }

        // تسريع التزامن إلى 800 ملي ثانية لضمان تجربة حية
        setInterval(sync, 800);
    </script>
</body>
</html>
