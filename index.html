<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - نظام الجولات التلقائي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #0d1117; --gold: #f1c40f; --cyan: #00f2ff; --pink: #ff007a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; padding: 15px; background: #161b22; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; }
        .balance { background: #000; padding: 5px 15px; border-radius: 50px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; }
        .game-board { position: relative; width: 320px; height: 320px; margin: 40px auto; background: #1c2128; border: 5px solid #30363d; border-radius: 20px; overflow: hidden; transition: 1s ease-in-out; }
        #ball { position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; box-shadow: 0 0 20px white; z-index: 10; display: none; }
        .controls { width: 90%; max-width: 400px; background: #161b22; padding: 20px; border-radius: 20px; text-align: center; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 18px; margin: 10px 0; text-align: center; }
        .btn-play { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(45deg, var(--cyan), var(--pink)); color: white; font-weight: 900; font-size: 18px; cursor: pointer; }
        #winner-msg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900;">SARAB SYSTEM v2</div>
        <div class="balance">⭐ <span id="balance">100,000</span></div>
    </div>

    <div id="board" class="game-board">
        <div id="ball"></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls">
        <div id="status-text" style="color:var(--cyan); font-weight:900; margin-bottom:10px;">في انتظار لاعبين (0/2)...</div>
        <input type="number" id="bet-input" value="1000" min="100">
        <button id="join-btn" class="btn-play" onclick="joinGame()">دخول السحب 🚀</button>
    </div>

    <div id="winner-msg">
        <h1 id="win-title" style="color:var(--gold)">انتهت الجولة!</h1>
        <div id="winner-data"></div>
        <button class="btn-play" style="width:200px; margin-top:20px;" onclick="resetLocal()">العودة للرئيسية</button>
    </div>

    <script>
        const BASE_URL = "https://sarab-app-84448-default-rtdb.firebaseio.com/game_room";
        let myId = "UID_" + Math.floor(Math.random() * 9999);
        let balance = parseInt(localStorage.getItem('sarab_bal')) || 100000;
        let players = [];
        let gameState = "waiting"; // waiting, counting, playing
        let isJoined = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ballEl = document.getElementById('ball');

        function updateBalUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            localStorage.setItem('sarab_bal', balance);
        }
        updateBalUI();

        // 1. مراقبة البيانات من Firebase
        async function watchGame() {
            try {
                const res = await fetch(`${BASE_URL}.json`);
                const data = await res.json();

                if (!data) { players = []; updateUI(); return; }

                // تحديث قائمة اللاعبين
                players = data.players ? Object.values(data.players) : [];
                gameState = data.state || "waiting";
                
                updateUI();

                // 2. منطق بدء العد التنازلي (إذا أصبحنا 2 أو أكثر)
                if (players.length >= 2 && gameState === "waiting") {
                    startGlobalCountdown();
                }

                // 3. منطق بدء حركة الكرة عند الجميع (إذا انتهى العد)
                if (gameState === "playing" && ballEl.style.display === "none") {
                    runBallPhysics(data.seed || 0.5);
                }

            } catch (e) { console.log("Error syncing..."); }
        }

        function updateUI() {
            document.getElementById('status-text').innerText = 
                gameState === "waiting" ? `في انتظار لاعبين (${players.length}/2)...` :
                gameState === "counting" ? "بدء السحب..." : "جاري تحديد الفائز!";
            drawBoard();
        }

        function drawBoard() {
            const total = players.reduce((s, p) => s + p.amount, 0);
            ctx.clearRect(0, 0, 320, 320);
            if (total === 0) { ctx.fillStyle = "#1c2128"; ctx.fillRect(0,0,320,320); return; }
            let currentX = 0;
            players.forEach(p => {
                const width = (p.amount / total) * 320;
                ctx.fillStyle = p.color;
                ctx.fillRect(currentX, 0, width, 320);
                currentX += width;
            });
        }

        async function joinGame() {
            if (isJoined) return;
            const amt = parseInt(document.getElementById('bet-input').value);
            if (amt > balance) return alert("رصيدك لا يكفي");

            isJoined = true;
            balance -= amt;
            updateBalUI();
            document.getElementById('join-btn').disabled = true;

            const pData = { id: myId, amount: amt, name: "لاعب "+myId.split('_')[1], color: `hsl(${Math.random()*360},70%,50%)` };
            await fetch(`${BASE_URL}/players/${myId}.json`, { method: 'PUT', body: JSON.stringify(pData) });
        }

        // دالة العد التنازلي وتغيير حالة الغرفة
        async function startGlobalCountdown() {
            // فقط أول لاعب دخل هو من يأمر السيرفر بالتغيير لمنع التضارب
            if (players[0].id === myId) {
                await fetch(`${BASE_URL}/state.json`, { method: 'PUT', body: JSON.stringify("counting") });
                let count = 10;
                let timer = setInterval(async () => {
                    count--;
                    if (count <= 0) {
                        clearInterval(timer);
                        // نرسل أمر "لعب" مع رقم عشوائي (Seed) ليكون المسار موحد عند الجميع
                        await fetch(`${BASE_URL}.json`, { 
                            method: 'PATCH', 
                            body: JSON.stringify({ state: "playing", seed: Math.random() }) 
                        });
                    }
                }, 1000);
            }
        }

        function runBallPhysics(seed) {
            ballEl.style.display = 'block';
            let posX = 160, posY = 160;
            let velX = (seed * 20) + 5; 
            let velY = (1 - seed) * 15 + 5;
            let friction = 0.985;

            function animate() {
                posX += velX; posY += velY;
                if (posX <= 0 || posX >= 300) velX *= -1;
                if (posY <= 0 || posY >= 300) velY *= -1;
                velX *= friction; velY *= friction;
                ballEl.style.left = posX + 'px';
                ballEl.style.top = posY + 'px';

                if (Math.abs(velX) > 0.2) requestAnimationFrame(animate);
                else finishGame(posX);
            }
            animate();
        }

        async function finishGame(finalX) {
            const total = players.reduce((s, p) => s + p.amount, 0);
            let currentX = 0;
            let winner = players[0];
            players.forEach(p => {
                const width = (p.amount / total) * 320;
                if (finalX >= currentX && finalX <= currentX + width) winner = p;
                currentX += width;
            });

            document.getElementById('winner-data').innerHTML = `<h2 style="color:${winner.color}">${winner.name} فاز بـ ${total} ⭐</h2>`;
            document.getElementById('winner-msg').style.display = 'flex';
            
            if (winner.id === myId) {
                balance += total;
                updateBalUI();
                confetti();
            }

            // تصفير الغرفة في السيرفر بعد 5 ثوانٍ من فوز الشخص (يقوم به أول لاعب فقط)
            if (players[0].id === myId) {
                setTimeout(async () => {
                    await fetch(`${BASE_URL}.json`, { method: 'DELETE' });
                }, 7000);
            }
        }

        function resetLocal() {
            location.reload();
        }

        setInterval(watchGame, 1000);
    </script>
</body>
</html>
