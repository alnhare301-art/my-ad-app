<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - التجربة الفخمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #818cf8;
            --secondary: #c084fc;
            --accent: #fb7185;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f1f5f9;
            margin: 0;
            padding-bottom: 120px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* تأثير الخلفية المتحركة */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
            z-index: -1;
        }

        /* الشريط العلوي الفخم */
        .header-ticker {
            position: fixed;
            top: 0; width: 100%; height: 60px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            z-index: 1000;
            padding: 0 15px;
        }

        .ticker-container {
            flex: 1;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            border-radius: 50px;
            padding: 5px 20px;
            margin-left: 10px;
            border: 1px solid var(--glass-border);
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            font-weight: 600;
            font-size: 14px;
            animation: scroll 15s linear infinite;
            color: var(--primary);
        }

        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .view-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            padding: 8px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(129, 140, 248, 0.4);
        }

        /* الحاوية الرئيسية */
        .main-content {
            padding: 90px 20px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
        }

        .logo-wrapper::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            z-index: -1;
            filter: blur(10px);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .logo { width: 100px; height: 100px; border-radius: 50%; border: 2px solid white; }

        /* بطاقات الإحصائيات */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .stat-box {
            background: var(--glass);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            text-align: center;
            transition: 0.3s;
        }

        .stat-box h3 { margin: 0; font-size: 26px; background: linear-gradient(to bottom, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-box p { margin: 5px 0 0; font-size: 12px; color: #94a3b8; font-weight: 600; }

        /* الإعلانات النشطة */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 30px 0 15px;
        }

        .section-header h2 { font-size: 18px; margin: 0; color: var(--secondary); }

        .ad-card {
            background: var(--glass);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .ad-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
        }

        .ad-title { font-size: 16px; font-weight: 800; display: block; margin-bottom: 15px; }

        .ad-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .join-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 15px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 15px;
            font-weight: 700;
            transition: 0.3s;
        }

        .join-btn:hover { background: var(--primary); color: white; }

        /* شريط التنقل السحري (المطور) */
        .nav-wrapper {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 75px;
            background: #fff;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            z-index: 2000;
        }

        .nav-wrapper ul {
            display: flex;
            width: 100%;
            padding: 0; margin: 0;
            list-style: none;
            justify-content: space-evenly;
        }

        .nav-item { position: relative; width: 60px; height: 60px; z-index: 1; }

        .nav-link {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-decoration: none;
            color: #334155;
        }

        .nav-icon {
            font-size: 1.5em;
            transition: 0.5s;
            line-height: 70px;
        }

        .nav-item.active .nav-icon {
            transform: translateY(-35px);
            color: #fff;
        }

        .nav-text {
            position: absolute;
            font-size: 10px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.5s;
        }

        .nav-item.active .nav-text {
            opacity: 1;
            transform: translateY(15px);
        }

        .nav-indicator {
            position: absolute;
            top: -50%;
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            border: 6px solid var(--bg);
            transition: 0.5s;
        }

        /* تحريك المؤشر */
        .nav-item:nth-child(1).active ~ .nav-indicator { left: 7%; }
        .nav-item:nth-child(2).active ~ .nav-indicator { left: 26%; }
        .nav-item:nth-child(3).active ~ .nav-indicator { left: 45%; }
        .nav-item:nth-child(4).active ~ .nav-indicator { left: 64%; }
        .nav-item:nth-child(5).active ~ .nav-indicator { left: 83%; }

    </style>
</head>
<body>

    <header class="header-ticker">
        <div class="ticker-container">
            <div class="ticker-text" id="ticker-content">جاري تحميل آخر الأخبار من سراب روليت...</div>
        </div>
        <a href="#" id="ticker-link" class="view-btn">مشاهدة</a>
    </header>

    <div class="main-content">
        <div class="hero-section">
            <div class="logo-wrapper">
                <img src="https://files.catbox.moe/5s7y7a.png" class="logo">
            </div>
            <h1 style="margin: 15px 0 5px; font-size: 28px; font-weight: 800;">روليت سراب</h1>
            <p style="color: #94a3b8; font-size: 13px;">تطبيق السحوبات والجوائز الأول</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <h3 id="total-views">104K</h3>
                <p>زيارة اليوم</p>
            </div>
            <div class="stat-box">
                <h3 id="active-ads-count">0</h3>
                <p>سحب نشط</p>
            </div>
        </div>

        <div class="section-header">
            <h2>🔥 سحوبات جارية</h2>
            <span style="font-size: 11px; color: var(--accent);">• مباشر</span>
        </div>

        <div id="ads-container">
            </div>
    </div>

    <nav class="nav-wrapper">
        <ul>
            <li class="nav-item active" onclick="changeTab(this)">
                <a href="#" class="nav-link">
                    <span class="nav-icon"><ion-icon name="home-outline"></ion-icon></span>
                    <span class="nav-text">الرئيسية</span>
                </a>
            </li>
            <li class="nav-item" onclick="changeTab(this)">
                <a href="#" class="nav-link">
                    <span class="nav-icon"><ion-icon name="trophy-outline"></ion-icon></span>
                    <span class="nav-text">سحوباتي</span>
                </a>
            </li>
            <li class="nav-item" onclick="changeTab(this)">
                <a href="#" class="nav-link">
                    <span class="nav-icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
                    <span class="nav-text">الدعم</span>
                </a>
            </li>
            <li class="nav-item" onclick="changeTab(this)">
                <a href="#" class="nav-link">
                    <span class="nav-icon"><ion-icon name="images-outline"></ion-icon></span>
                    <span class="nav-text">المعرض</span>
                </a>
            </li>
            <li class="nav-item" onclick="changeTab(this)">
                <a href="#" class="nav-link">
                    <span class="nav-icon"><ion-icon name="settings-outline"></ion-icon></span>
                    <span class="nav-text">الإعدادات</span>
                </a>
            </li>
            <div class="nav-indicator"></div>
        </ul>
    </nav>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <script>
        // تبديل التبويبات
        function changeTab(element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        const dbUrl = "https://sarab-app-84448-default-rtdb.firebaseio.com";

        async function updateData() {
            try {
                // تحديث الشريط العلوي
                const tRes = await fetch(`${dbUrl}/ticker.json`);
                const tData = await tRes.json();
                if(tData) {
                    document.getElementById('ticker-content').innerText = tData.text;
                    document.getElementById('ticker-link').href = tData.link || "#";
                }

                // تحديث الإعلانات
                const aRes = await fetch(`${dbUrl}/active_ads.json`);
                const ads = await aRes.json();
                const container = document.getElementById('ads-container');
                container.innerHTML = "";
                
                let count = 0;
                if(ads) {
                    Object.keys(ads).forEach(key => {
                        const ad = ads[key];
                        count++;
                        container.innerHTML += `
                            <div class="ad-card">
                                <span class="ad-title">${ad.title}</span>
                                <div class="ad-footer">
                                    <span>👁️ ${ad.views || 0} مشاهدة</span>
                                    <span style="color:var(--accent)">ينتهي: ${ad.end_at}</span>
                                </div>
                                <a href="${ad.post_url}" class="join-btn" onclick="incView('${key}', ${ad.views || 0})">دخول السحب الفاخر 🔓</a>
                            </div>`;
                    });
                }
                document.getElementById('active-ads-count').innerText = count;
                if(count === 0) container.innerHTML = "<p style='text-align:center; color:#64748b;'>لا توجد سحوبات نشطة حالياً</p>";

            } catch(e) { console.log("Error fetching data"); }
        }

        async function incView(id, current) {
            fetch(`${dbUrl}/active_ads/${id}/views.json`, { method: 'PUT', body: JSON.stringify(current + 1) });
        }

        setInterval(updateData, 5000);
        updateData();
    </script>
</body>
</html>
