<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA V2 - تجربة سريعة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #D4AF37; --dark: #060606; --card: #111111; --border: rgba(212,175,55,0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--dark); color: white; font-family: sans-serif; padding: 12px; }
        .wrapper { max-width: 420px; margin: 0 auto; }
        .header, .status-bar { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .arena-container { position: relative; width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden; border: 4px solid rgba(212,175,55,0.3); background: #0c0c0c; }
        #arenaCanvas { width: 100%; height: 100%; display: block; }
        .countdown-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); font-size: 80px; font-weight: 900; }
        .controls { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-top: 12px; }
        #joinBtn { width: 100%; background: linear-gradient(135deg, var(--gold), #b8960c); padding: 15px; border-radius: 12px; border: none; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        .winner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <div style="color:var(--gold); font-weight:bold;">ميدان فورونوي التجريبي 🧪</div>
        <div id="balDisplay">100,000 ⭐</div>
    </div>

    <div class="status-bar">
        <span id="statusLabel">اضغط بالأسفل لدخول المنافسة فوراً!</span>
        <div style="background:rgba(212,175,55,0.2); padding:4px 10px; border-radius:8px;" id="playerCount">0 لاعبين</div>
    </div>

    <div class="arena-container">
        <canvas id="arenaCanvas" width="600" height="600"></canvas>
        <div class="countdown-overlay" id="countdownOverlay">10</div>
    </div>

    <div class="controls">
        <button id="joinBtn" onclick="botSimulation()">اضغط لبدء التحدي التجريبي الفوري ⚔️</button>
    </div>
</div>

<div class="winner-overlay" id="winnerOverlay">
    <h1 style="font-size:40px;">🏆 الفائز بالجولة 🏆</h1>
    <h2 id="winnerName" style="color:var(--gold); margin: 20px 0;">-</h2>
    <p>سيتم تصفير الساحة تلقائياً بعد ثوانٍ للتجربة مجدداً...</p>
</div>

<script>
    // إعدادات افتراضية سريعة للتجربة الفورية بدون سيرفر
    let myBal = 100000;
    let players = [];
    let isSpinning = false, showBall = false;
    let ballX = 300, ballY = 300;
    const COLORS = ["#3b82f6", "#ef4444", "#10b981", "#a855f7"];

    // محاكاة سريعة: عند الضغط، يدخل المستخدم ومعه 3 لاعبين وهميين فوراً لتجربة التقسيم والكرة!
    function botSimulation() {
        if(isSpinning) return;
        document.getElementById("joinBtn").disabled = true;
        
        // إضافة المستخدم + 3 بوتات وهمية لملء الساحة فوراً
        players = [
            { id: "me", name: "أنت (المحارب)", amount: 5000 },
            { id: "bot1", name: "المنافس الذكي", amount: 3000 },
            { id: "bot2", name: "صائد الجوائز", amount: 7000 },
            { id: "bot3", name: "المغامر المحترف", amount: 4000 }
        ];
        
        document.getElementById("playerCount").innerText = players.length + " لاعبين";
        drawMap(players);

        // بدء عد تنازلي سريع (3 ثوانٍ فقط للتجربة السريعة)
        let count = 3;
        const overlay = document.getElementById("countdownOverlay");
        overlay.style.display = "flex";
        overlay.innerText = count;

        let timer = setInterval(() => {
            count--;
            overlay.innerText = count;
            if(count <= 0) {
                clearInterval(timer);
                overlay.style.display = "none";
                runPhysics(); // انطلاق الكرة!
            }
        }, 1000);
    }

    function getSeeds(pList) {
        let total = pList.reduce((s, p) => s + p.amount, 0);
        // توزيع مراكز ثابتة ومثالية للمربع التجريبي
        const fixedPositions = [{x:150, y:150}, {x:450, y:150}, {x:150, y:450}, {x:450, y:450}];
        return pList.map((p, idx) => ({
            ...p,
            ratio: p.amount / total,
            x: fixedPositions[idx].x,
            y: fixedPositions[idx].y,
            color: COLORS[idx % COLORS.length]
        }));
    }

    function drawMap(pList) {
        const canvas = document.getElementById("arenaCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 600, 600);

        if(pList.length === 0) { ctx.fillStyle = "#0c0c0c"; ctx.fillRect(0, 0, 600, 600); return; }

        let seeds = getSeeds(pList);
        let imgData = ctx.createImageData(600, 600);
        let d = imgData.data;

        for (let y = 0; y < 600; y++) {
            for (let x = 0; x < 600; x++) {
                let minDist = Infinity, closest = null;
                for (let i = 0; i < seeds.length; i++) {
                    let s = seeds[i];
                    let dx = x - s.x, dy = y - s.y;
                    let dist = (dx*dx + dy*dy) / (s.ratio * s.ratio * 8 + 0.1);
                    if(dist < minDist) { minDist = dist; closest = s; }
                }
                if(closest) {
                    let idx = (y * 600 + x) * 4;
                    let c = closest.color;
                    d[idx] = parseInt(c.slice(1,3), 16);
                    d[idx+1] = parseInt(c.slice(3,5), 16);
                    d[idx+2] = parseInt(c.slice(5,7), 16);
                    d[idx+3] = 255;
                }
            }
        }
        ctx.putImageData(imgData, 0, 0);

        seeds.forEach(s => {
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.beginPath(); ctx.arc(s.x, s.y, 35, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(s.name.substring(0,10), s.x, s.y + 5);
        });

        if(showBall) {
            ctx.fillStyle = "#fff"; ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
            ctx.beginPath(); ctx.arc(ballX, ballY, 12, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function runPhysics() {
        isSpinning = true; showBall = true;
        ballX = 300; ballY = 300;
        let speed = 25;
        let angle = Math.random() * Math.PI * 2;
        let vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed;

        function frame() {
            ballX += vx; ballY += vy;
            if(ballX <= 15 || ballX >= 585) vx *= -1;
            if(ballY <= 15 || ballY >= 585) vy *= -1;
            vx *= 0.98; vy *= 0.98;

            drawMap(players);

            if(Math.sqrt(vx*vx + vy*vy) > 0.3) {
                requestAnimationFrame(frame);
            } else {
                // الكشف عن الفائز بالبكسل فورا
                const canvas = document.getElementById("arenaCanvas");
                const ctx = canvas.getContext("2d");
                let p = ctx.getImageData(Math.round(ballX), Math.round(ballY), 1, 1).data;
                let hex = "#" + ("0" + p[0].toString(16)).slice(-2) + ("0" + p[1].toString(16)).slice(-2) + ("0" + p[2].toString(16)).slice(-2);
                
                let seeds = getSeeds(players);
                let winner = seeds.find(s => s.color.toLowerCase() === hex.toLowerCase()) || players[0];
                
                document.getElementById("winnerOverlay").style.display = "flex";
                document.getElementById("winnerName").innerText = winner.name;

                // إعادة تصفير تلقائي بعد 4 ثوانٍ للتجربة مرة أخرى
                setTimeout(() => {
                    document.getElementById("winnerOverlay").style.display = "none";
                    document.getElementById("joinBtn").disabled = false;
                    isSpinning = false; showBall = false;
                    players = [];
                    document.getElementById("playerCount").innerText = "0 لاعبين";
                    drawMap([]);
                }, 4000);
            }
        }
        requestAnimationFrame(frame);
    }
    drawMap([]);
</script>
</body>
</html>
