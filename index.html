<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - النسخة التفاعلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #818cf8;
            --secondary: #c084fc;
            --accent: #fb7185;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f1f5f9;
            margin: 0;
            padding-bottom: 120px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- 1. تأثير الشعار النابض --- */
        .logo-wrapper {
            position: relative;
            display: inline-block;
            animation: floating 3s ease-in-out infinite;
        }

        .logo {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 3px solid white;
            position: relative;
            z-index: 2;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(15px);
            z-index: 1;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- 2. تنسيق المحتوى والبطاقات --- */
        .header-ticker {
            position: fixed;
            top: 0; width: 100%; height: 65px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; z-index: 1000; padding: 0 20px;
        }

        .ticker-container {
            flex: 1; overflow: hidden; background: rgba(0,0,0,0.3);
            border-radius: 50px; padding: 8px 20px; margin-left: 10px; border: 1px solid var(--glass-border);
        }

        .ticker-text {
            display: inline-block; white-space: nowrap; font-weight: 600;
            font-size: 13px; animation: scroll 20s linear infinite; color: var(--primary);
        }

        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .main-content { padding: 100px 20px 20px; max-width: 500px; margin: 0 auto; }

        .stat-box {
            background: var(--glass); padding: 20px; border-radius: 24px;
            border: 1px solid var(--glass-border); text-align: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stat-box:active { transform: scale(0.95); }

        .ad-card {
            background: var(--glass); border-radius: 28px; padding: 25px;
            margin-bottom: 25px; border: 1px solid var(--glass-border);
            position: relative; overflow: hidden;
            transition: all 0.3s ease;
        }

        .ad-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        /* --- 3. زر الدخول بتأثير الإطار الدوار --- */
        .glow-border-box {
            position: relative; padding: 3px; border-radius: 18px;
            overflow: hidden; margin-top: 15px;
        }

        .glow-border-box::before {
            content: ''; position: absolute; inset: -20%;
            background: conic-gradient(from var(--angle), transparent 70%, var(--primary), var(--accent), var(--primary));
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate { from { --angle: 0deg; } to { --angle: 360deg; } }

        .join-btn {
            position: relative; background: #0f172a; color: white;
            padding: 14px; border-radius: 16px; display: block;
            text-align: center; font-weight: 800; text-decoration: none;
            z-index: 1; transition: 0.2s; border: none; width: 100%; cursor: pointer;
        }

        .join-btn:active { transform: scale(0.92); }

        /* --- 4. شريط التنقل السفلي السحري --- */
        .nav-wrapper {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 75px;
            background: #fff; border-radius: 25px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 2000;
        }

        .nav-wrapper ul { display: flex; width: 100%; list-style: none; padding: 0; justify-content: space-evenly; }
        .nav-item { position: relative; width: 60px; height: 60px; }
        .nav-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #334155; }
        .nav-icon { font-size: 1.6em; line-height: 75px; transition: 0.5s; }
        .nav-item.active .nav-icon { transform: translateY(-35px); color: #fff; }
        .nav-text { position: absolute; font-size: 10px; font-weight: 800; opacity: 0; transform: translateY(20px); transition: 0.5s; }
        .nav-item.active .nav-text { opacity: 1; transform: translateY(15px); }

        .nav-indicator {
            position: absolute; top: -50%; width: 60px; height: 60px;
            background: var(--primary); border-radius: 50%;
            border: 6px solid var(--bg); transition: 0.5s;
        }

        .nav-item:nth-child(1).active ~ .nav-indicator { left: 7%; }
        .nav-item:nth-child(2).active ~ .nav-indicator { left: 26%; }
        .nav-item:nth-child(3).active ~ .nav-indicator { left: 45%; }
        .nav-item:nth-child(4).active ~ .nav-indicator { left: 64%; }
        .nav-item:nth-child(5).active ~ .nav-indicator { left: 83%; }

    </style>
</head>
<body>

    <header class="header-ticker">
        <div class="ticker-container">
            <div class="ticker-text" id="ticker-content">مرحباً بك في روليت سراب.. واحتك للحظ والجوائز!</div>
        </div>
    </header>

    <div class="main-content">
        <div class="hero-section">
            <div class="logo-wrapper">
                <img src="https://files.catbox.moe/5s7y7a.png" class="logo">
            </div>
            <h1 style="margin-top:15px; font-size:32px; font-weight:800;">روليت سراب</h1>
            <p style="color:var(--primary); font-size:13px;">تفاعل مع الحظ بأناقة</p>
        </div>

        <div class="stats-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0;">
            <div class="stat-box"><h3>104K</h3><p>زيارة اليوم</p></div>
            <div class="stat-box"><h3 id="active-ads-count">0</h3><p>سحب نشط</p></div>
        </div>

        <h2 style="font-size:20px; margin-bottom:20px;">🔥 السحوبات النشطة</h2>
        <div id="ads-container"></div>
    </div>

    <nav class="nav-wrapper">
        <ul>
            <li class="nav-item active" onclick="changeTab(this)"><a href="#" class="nav-link"><span class="nav-icon"><ion-icon name="home"></ion-icon></span><span class="nav-text">الرئيسية</span></a></li>
            <li class="nav-item" onclick="changeTab(this)"><a href="#" class="nav-link"><span class="nav-icon"><ion-icon name="trophy-outline"></ion-icon></span><span class="nav-text">سحوباتي</span></a></li>
            <li class="nav-item" onclick="changeTab(this)"><a href="#" class="nav-link"><span class="nav-icon"><ion-icon name="chatbubbles-outline"></ion-icon></span><span class="nav-text">الدعم</span></a></li>
            <li class="nav-item" onclick="changeTab(this)"><a href="#" class="nav-link"><span class="nav-icon"><ion-icon name="images-outline"></ion-icon></span><span class="nav-text">المعرض</span></a></li>
            <li class="nav-item" onclick="changeTab(this)"><a href="#" class="nav-link"><span class="nav-icon"><ion-icon name="settings-outline"></ion-icon></span><span class="nav-text">الإعدادات</span></a></li>
            <div class="nav-indicator"></div>
        </ul>
    </nav>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script>
        function changeTab(element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        // دالة إطلاق القصاصات الملونة
        function fireConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#818cf8', '#c084fc', '#fb7185']
            });
        }

        const dbUrl = "https://sarab-app-84448-default-rtdb.firebaseio.com";

        async function updateData() {
            try {
                const aRes = await fetch(`${dbUrl}/active_ads.json`);
                const ads = await aRes.json();
                const container = document.getElementById('ads-container');
                container.innerHTML = "";
                let count = 0;
                if(ads) {
                    Object.keys(ads).forEach(key => {
                        const ad = ads[key];
                        count++;
                        container.innerHTML += `
                            <div class="ad-card">
                                <span style="font-size:18px; font-weight:800; display:block; margin-bottom:15px;">${ad.title}</span>
                                <div style="display:flex; justify-content:space-between; font-size:12px; color:#94a3b8;">
                                    <span>👁️ ${ad.views || 0}</span>
                                    <span>ينتهي: ${ad.end_at}</span>
                                </div>
                                <div class="glow-border-box">
                                    <button class="join-btn" onclick="handleJoin('${key}', ${ad.views || 0}, '${ad.post_url}')">دخول السحب 🔓</button>
                                </div>
                            </div>`;
                    });
                }
                document.getElementById('active-ads-count').innerText = count;
            } catch(e) { console.log("Error"); }
        }

        function handleJoin(id, current, url) {
            fireConfetti(); // إطلاق الاحتفال
            incView(id, current); // زيادة المشاهدات
            setTimeout(() => { window.location.href = url; }, 800); // الانتقال للرابط بعد لحظة
        }

        async function incView(id, current) {
            fetch(`${dbUrl}/active_ads/${id}/views.json`, { method: 'PUT', body: JSON.stringify(current + 1) });
        }

        setInterval(updateData, 5000);
        updateData();
    </script>
</body>
</html>
