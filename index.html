<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - اللعب الجماعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #0d1117; --gold: #f1c40f; --cyan: #00f2ff; --pink: #ff007a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; padding: 15px; background: #161b22; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; }
        .balance { background: #000; padding: 5px 15px; border-radius: 50px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; }
        .game-board { position: relative; width: 320px; height: 320px; margin: 40px auto; background: #1c2128; border: 5px solid #30363d; border-radius: 20px; overflow: hidden; transition: 1s ease-in-out; }
        #ball { position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; box-shadow: 0 0 15px white; z-index: 10; display: none; }
        .controls { width: 90%; max-width: 400px; background: #161b22; padding: 20px; border-radius: 20px; text-align: center; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 18px; margin: 10px 0; text-align: center; }
        .btn-play { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(45deg, var(--cyan), var(--pink)); color: white; font-weight: 900; font-size: 18px; cursor: pointer; }
        #winner-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 30px; border-radius: 20px; border: 2px solid var(--gold); text-align: center; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900;">SARAB MULTIPLAYER</div>
        <div class="balance">⭐ <span id="balance">100,000</span></div>
    </div>

    <div id="board" class="game-board">
        <div id="ball"></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls">
        <div id="timer-text" style="color:var(--cyan); font-weight:900; margin-bottom:10px;">انتظار اللاعبين...</div>
        <input type="number" id="bet-input" value="1000" min="100">
        <button id="join-btn" class="btn-play" onclick="joinGame()">دخول السحب الجماعي 🌍</button>
        <p id="player-count" style="font-size: 12px; color: #8b949e; margin-top: 10px;">المتصلون الآن: جاري التحقق...</p>
    </div>

    <div id="winner-msg">
        <h1 style="color:var(--gold)">الفائز بالجولة</h1>
        <div id="winner-data"></div>
        <button class="btn-play" onclick="location.reload()">جولة جديدة</button>
    </div>

    <script>
        // رابط قاعدة بياناتك (Firebase)
        const DB_URL = "https://sarab-app-84448-default-rtdb.firebaseio.com/live_game.json";
        
        let myId = "user_" + Math.floor(Math.random() * 10000);
        let balance = parseInt(localStorage.getItem('sarab_bal')) || 100000;
        let players = [];
        let isParticipating = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function updateBalanceUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            localStorage.setItem('sarab_bal', balance);
        }
        updateBalanceUI();

        // دالة لجلب البيانات من السيرفر كل ثانية (Sync)
        async function syncGame() {
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                
                if (data && data.players) {
                    players = Object.values(data.players);
                    document.getElementById('player-count').innerText = `المشاركون: ${players.length} / 20`;
                    drawSections();
                    
                    // إذا كان هناك أكثر من لاعب، نبدأ عرض مؤقت مشترك
                    if (players.length >= 2) {
                        document.getElementById('timer-text').innerText = "الجولة ستبدأ قريباً!";
                    }
                }
            } catch (e) { console.error("Sync Error"); }
        }

        function drawSections() {
            const total = players.reduce((s, p) => s + p.amount, 0);
            if (total === 0) { ctx.fillStyle = "#1c2128"; ctx.fillRect(0,0,320,320); return; }
            let currentX = 0;
            players.forEach(p => {
                const width = (p.amount / total) * 320;
                ctx.fillStyle = p.color;
                ctx.fillRect(currentX, 0, width, 320);
                currentX += width;
            });
        }

        async function joinGame() {
            const amt = parseInt(document.getElementById('bet-input').value);
            if (amt > balance) return alert("رصيدك لا يكفي");
            if (isParticipating) return alert("أنت مشترك بالفعل");

            balance -= amt;
            updateBalanceUI();
            isParticipating = true;
            document.getElementById('join-btn').disabled = true;

            const myData = {
                id: myId,
                amount: amt,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                name: "لاعب " + myId.split('_')[1]
            };

            // رفع بياناتي للسيرفر ليراها الجميع
            await fetch(`https://sarab-app-84448-default-rtdb.firebaseio.com/live_game/players/${myId}.json`, {
                method: 'PUT',
                body: JSON.stringify(myData)
            });
        }

        // تحديث مستمر كل ثانية للجميع
        setInterval(syncGame, 1500);

    </script>
</body>
</html>
