<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - نظام الكيرم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --gold: #f1c40f;
            --cyan: #00f2ff;
            --pink: #ff007a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        .header {
            width: 100%; padding: 15px; background: #161b22;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #30363d;
        }

        .balance {
            background: #000; padding: 5px 15px; border-radius: 50px;
            border: 1px solid var(--gold); color: var(--gold); font-weight: 900;
        }

        /* ساحة اللعبة */
        .game-board {
            position: relative;
            width: 320px; height: 320px;
            margin: 40px auto;
            background: #1c2128;
            border: 5px solid #30363d;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 1s ease-in-out; /* للزوم */
        }

        #gameCanvas { width: 100%; height: 100%; }

        /* الكرة المتحركة */
        #ball {
            position: absolute;
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px white, 0 0 5px rgba(0,0,0,0.5);
            z-index: 10;
            display: none;
            pointer-events: none;
        }

        .controls {
            width: 90%; max-width: 400px;
            background: #161b22; padding: 20px;
            border-radius: 20px; text-align: center;
        }

        input {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #30363d; background: #0d1117;
            color: white; font-size: 18px; margin: 10px 0; text-align: center;
        }

        .btn-play {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: linear-gradient(45deg, var(--cyan), var(--pink));
            color: white; font-weight: 900; font-size: 18px; cursor: pointer;
        }

        .btn-play:disabled { opacity: 0.3; }

        .timer-box {
            font-size: 24px; font-weight: 900; color: var(--cyan); margin-bottom: 10px;
        }

        #winner-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); padding: 30px; border-radius: 20px;
            border: 2px solid var(--gold); text-align: center; display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900;">SARAB ROULETTE</div>
        <div class="balance">⭐ <span id="balance">100,000</span></div>
    </div>

    <div id="board" class="game-board">
        <div id="ball"></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls">
        <div id="timer-text" class="timer-box">جاهز للبدء</div>
        <input type="number" id="bet-input" value="1000" min="100">
        <button id="join-btn" class="btn-play" onclick="joinGame()">مشاركة في الجولة</button>
        <p id="player-count" style="font-size: 12px; color: #8b949e; margin-top: 10px;">المشاركون: 0 / 20</p>
    </div>

    <div id="winner-msg">
        <h1 style="color:var(--gold)">انتهت الجولة!</h1>
        <div id="winner-data"></div>
        <button class="btn-play" style="margin-top:20px;" onclick="closeWinner()">استمرار</button>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('sarab_bal')) || 100000;
        let players = [];
        let gameActive = false;
        let timer = 10;
        let interval;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ballEl = document.getElementById('ball');
        const boardEl = document.getElementById('board');

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            localStorage.setItem('sarab_bal', balance);
            document.getElementById('player-count').innerText = `المشاركون: ${players.length} / 20`;
        }
        updateUI();

        function drawSections() {
            const total = players.reduce((s, p) => s + p.amount, 0);
            if (total === 0) {
                ctx.fillStyle = "#1c2128";
                ctx.fillRect(0, 0, 320, 320);
                return;
            }

            let currentX = 0;
            // رسم الواجهة بشكل مربعات ملونة حسب النسبة (مثل الكيرم)
            players.forEach(p => {
                const width = (p.amount / total) * 320;
                ctx.fillStyle = p.color;
                ctx.fillRect(currentX, 0, width, 320);
                currentX += width;
            });
        }
        drawSections();

        function joinGame() {
            const amt = parseInt(document.getElementById('bet-input').value);
            if (amt > balance) return alert("الرصيد غير كافٍ");
            
            balance -= amt;
            players.push({
                id: Date.now(),
                amount: amt,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                name: "أنت"
            });
            
            document.getElementById('join-btn').disabled = true;
            updateUI();
            drawSections();

            if (players.length === 1) startCountdown();
        }

        function startCountdown() {
            timer = 10;
            interval = setInterval(() => {
                timer--;
                document.getElementById('timer-text').innerText = `يبدأ السحب خلال: ${timer}`;
                
                if (timer <= 0) {
                    clearInterval(interval);
                    if (players.length >= 2) startPhysicsGame();
                    else {
                        alert("لا يوجد منافسين حقيقيين حالياً، تم استرداد رصيدك.");
                        balance += players[0].amount;
                        resetGame();
                    }
                }
            }, 1000);
        }

        function startPhysicsGame() {
            gameActive = true;
            ballEl.style.display = 'block';
            document.getElementById('timer-text').innerText = "تحديد الفائز...";
            
            let posX = 150, posY = 150;
            let velX = 15, velY = 12;
            let friction = 0.985; // التباطؤ تدريجياً

            function moveBall() {
                posX += velX;
                posY += velY;

                // الارتداد من الجوانب
                if (posX <= 0 || posX >= 300) velX *= -1;
                if (posY <= 0 || posY >= 300) velY *= -1;

                velX *= friction;
                velY *= friction;

                ballEl.style.left = posX + 'px';
                ballEl.style.top = posY + 'px';

                // تأثير الزوم عند التباطؤ
                if (Math.abs(velX) < 5) boardEl.style.transform = "scale(1.3)";

                if (Math.abs(velX) > 0.2) {
                    requestAnimationFrame(moveBall);
                } else {
                    determineWinner(posX);
                }
            }
            moveBall();
        }

        function determineWinner(finalX) {
            const total = players.reduce((s, p) => s + p.amount, 0);
            let currentX = 0;
            let winner = players[0];

            players.forEach(p => {
                const width = (p.amount / total) * 320;
                if (finalX >= currentX && finalX <= currentX + width) {
                    winner = p;
                }
                currentX += width;
            });

            showWinner(winner, total);
        }

        function showWinner(winner, prize) {
            const msg = document.getElementById('winner-msg');
            const data = document.getElementById('winner-data');
            
            data.innerHTML = `
                <div style="width:80px; height:80px; background:${winner.color}; border-radius:50%; margin: 0 auto; border:4px solid white;"></div>
                <h2>الفائز: ${winner.name}</h2>
                <h1 style="color:var(--gold)">+${prize.toLocaleString()} ⭐</h1>
            `;
            
            msg.style.display = 'block';
            confetti({ particleCount: 200, spread: 80 });

            if (winner.name === "أنت") {
                balance += prize;
                updateUI();
            }
        }

        function closeWinner() {
            document.getElementById('winner-msg').style.display = 'none';
            resetGame();
        }

        function resetGame() {
            players = [];
            timer = 10;
            boardEl.style.transform = "scale(1)";
            ballEl.style.display = 'none';
            document.getElementById('timer-text').innerText = "جاهز للبدء";
            document.getElementById('join-btn').disabled = false;
            drawSections();
            updateUI();
        }
    </script>
</body>
</html>
