<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Game System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #0b0e14; --panel: #161b22; --accent: #3867d6; --gold: #fbc531; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }

        /* شريط الحالة العلوي */
        .status-bar { width: 100%; background: var(--panel); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .game-id { font-size: 12px; color: #8b949e; }
        
        /* ساحة اللعب الدائرية */
        .wheel-section { position: relative; width: 300px; height: 300px; margin: 25px 0; }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #222; }
        #pointer { position: absolute; width: 20px; height: 20px; background: #fff; border-radius: 50%; z-index: 10; display: none; box-shadow: 0 0 15px #fff; }
        
        .timer-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #000; }

        /* قائمة المتسابقين (مثل الفيديو) */
        .players-list { width: 92%; max-width: 400px; background: var(--panel); border-radius: 15px; padding: 15px; margin-top: 20px; }
        .player-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #222; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .player-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #444; }
        .player-name { font-weight: bold; font-size: 14px; }
        .player-stats { text-align: left; }
        .percentage { color: var(--gold); font-weight: 900; font-size: 13px; }
        .amount { color: #8b949e; font-size: 11px; }

        /* منطقة التحكم والإضافة */
        .action-area { width: 92%; max-width: 400px; margin-top: 15px; }
        .input-box { background: #000; border: 1px solid #333; border-radius: 12px; display: flex; align-items: center; padding: 10px; margin-bottom: 10px; }
        input { flex: 1; background: transparent; border: none; color: white; text-align: center; font-size: 18px; outline: none; }
        .btn-add { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; }
        .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

        /* رسالة انتظار/بدء */
        .system-msg { font-size: 14px; color: var(--gold); margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="status-bar">
        <div class="game-id">Game #<span id="game-num">471813</span></div>
        <div style="color: var(--gold); font-weight: 900;">⭐ <span id="my-bal">100,000</span></div>
    </div>

    <div class="wheel-section" id="wheel-container">
        <div id="pointer"></div>
        <div id="countdown" class="timer-overlay"></div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div id="system-status" class="system-msg">بانتظار المشاركين (0/2)...</div>

    <div class="action-area">
        <div class="input-box">
            <input type="number" id="bet-input" value="1.0">
        </div>
        <button id="add-btn" class="btn-add" onclick="joinGame()">إضافة (Add Fighter) ⚔️</button>
    </div>

    <div class="players-list">
        <div style="font-size: 13px; color: #8b949e; margin-bottom: 10px;">المقاتلون (Fighters)</div>
        <div id="players-container">
            </div>
    </div>

    <script>
        const DB_URL = "https://sarab-app-84448-default-rtdb.firebaseio.com/global_system";
        let myId = "ID_" + Math.floor(Math.random() * 9000);
        let balance = 100000;
        let players = [];
        let isSpinning = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pointer = document.getElementById('pointer');

        // --- نظام التزامن مع السيرفر ---
        async function sync() {
            try {
                const res = await fetch(`${DB_URL}.json`);
                const data = await res.json();
                
                if (!data || !data.players) {
                    players = [];
                    updateList();
                    drawWheel();
                    return;
                }

                players = Object.values(data.players);
                const state = data.state || "waiting";

                // تحديث الواجهة بناءً على الحالة
                if (state === "waiting") {
                    document.getElementById('system-status').innerText = `بانتظار المشاركين (${players.length}/32)...`;
                    if (players.length >= 2 && players[0].id === myId) startSequence();
                }

                if (state === "counting") {
                    document.getElementById('countdown').innerText = data.timer;
                    document.getElementById('system-status').innerText = "الجولة تبدأ الآن...";
                }

                if (state === "playing" && !isSpinning) {
                    startBall(data.seed);
                }

                updateList();
                drawWheel();
            } catch (e) {}
        }

        // --- رسم الخريطة (النسب) ---
        function drawWheel() {
            ctx.clearRect(0,0,600,600);
            const total = players.reduce((s, p) => s + p.amount, 0);
            if (total === 0) {
                ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(300,300,300,0,Math.PI*2); ctx.fill();
                return;
            }
            let start = 0;
            players.forEach(p => {
                const slice = (p.amount / total) * Math.PI * 2;
                ctx.beginPath(); ctx.moveTo(300,300); ctx.arc(300,300,300,start,start+slice);
                ctx.fillStyle = p.color; ctx.fill();
                start += slice;
            });
            // المركز الفارغ (مثل الفيديو)
            ctx.beginPath(); ctx.arc(300,300,80,0,Math.PI*2); ctx.fillStyle = "#0b0e14"; ctx.fill();
        }

        // --- تحديث قائمة المشاركين والنسب ---
        function updateList() {
            const container = document.getElementById('players-container');
            const total = players.reduce((s, p) => s + p.amount, 0);
            container.innerHTML = "";
            
            players.sort((a,b) => b.amount - a.amount).forEach(p => {
                const perc = total > 0 ? ((p.amount/total)*100).toFixed(2) : 0;
                container.innerHTML += `
                    <div class="player-item">
                        <div class="player-info">
                            <div class="player-avatar" style="background:${p.color}"></div>
                            <div class="player-name">${p.name}</div>
                        </div>
                        <div class="player-stats">
                            <div class="percentage">${perc}%</div>
                            <div class="amount">∇ ${p.amount}</div>
                        </div>
                    </div>
                `;
            });
        }

        // --- دخول الشخص الجولة ---
        async function joinGame() {
            const val = parseFloat(document.getElementById('bet-input').value);
            document.getElementById('add-btn').disabled = true;

            const pData = {
                id: myId, name: "لاعب " + myId.split('_')[1],
                amount: val, color: `hsl(${Math.random()*360}, 70%, 50%)`
            };
            await fetch(`${DB_URL}/players/${myId}.json`, { method: 'PUT', body: JSON.stringify(pData) });
        }

        // --- نظام العد التنازلي ---
        async function startSequence() {
            await fetch(`${DB_URL}/state.json`, { method: 'PUT', body: JSON.stringify("counting") });
            let timer = 10;
            let iv = setInterval(async () => {
                await fetch(`${DB_URL}/timer.json`, { method: 'PUT', body: JSON.stringify(timer) });
                timer--;
                if (timer < 0) {
                    clearInterval(iv);
                    await fetch(`${DB_URL}.json`, { method: 'PATCH', body: JSON.stringify({ state: "playing", seed: Math.random() }) });
                }
            }, 1000);
        }

        // --- حركة الكرة وانهاء الجولة ---
        function startBall(seed) {
            isSpinning = true;
            pointer.style.display = "block";
            document.getElementById('countdown').innerText = "";
            
            let px = 150, py = 150;
            let vx = (seed * 40) + 10; let vy = (1-seed) * 40 + 10;
            let fric = 0.985;

            function anim() {
                px += vx; py += vy;
                if (px <= 5 || px >= 285) vx *= -1;
                if (py <= 5 || py >= 285) vy *= -1;
                vx *= fric; vy *= fric;
                pointer.style.left = px + 'px'; pointer.style.top = py + 'px';

                if (Math.abs(vx) > 0.2) requestAnimationFrame(anim);
                else finishGame();
            }
            anim();
        }

        async function finishGame() {
            // تصفير الجولة تماماً بعد الفوز
            if (players[0].id === myId) {
                setTimeout(async () => {
                    await fetch(`${DB_URL}.json`, { method: 'DELETE' });
                    location.reload();
                }, 7000);
            }
        }

        setInterval(sync, 1000);
    </script>
</body>
</html>
