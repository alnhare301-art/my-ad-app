<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت - ساحة الميدان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F7E7CE;
            --royal-black: #050505;
            --bronze: #CD7F32;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--royal-black);
            color: white;
            margin: 0;
            overflow: hidden;
        }
        .gold-btn {
            background: linear-gradient(135deg, #D4AF37, #A67C00);
            color: black;
            font-weight: 900;
            transition: all 0.3s ease;
        }
        .gold-btn:disabled { opacity: 0.5; filter: grayscale(1); }
        .confetti-piece {
            position: fixed;
            top: -10px;
            z-index: 3000;
            animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen pb-8">
        <header class="sticky top-0 z-50 bg-[#050505eb] backdrop-blur-md border-b border-[rgba(212,175,55,0.15)]">
            <div class="flex items-center justify-between px-4 py-3 max-w-lg mx-auto">
                <div class="flex items-center gap-2 text-[var(--gold)]">
                    <span class="font-extrabold text-xl text-yellow-500">ميدان الروليت</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 font-extrabold px-3 py-1.5 rounded-xl bg-[rgba(212,175,55,0.08)] border border-[rgba(212,175,55,0.15)] text-[var(--gold)]">
                        <span id="balanceDisplay">0</span> ⭐
                    </div>
                </div>
            </div>
        </header>

        <div class="px-4 max-w-lg mx-auto mt-4">
            <div id="statusCard" class="rounded-2xl p-4 mb-5 border border-[rgba(212,175,55,0.15)] bg-gradient-to-br from-[rgba(212,175,55,0.08)] to-[rgba(212,175,55,0.03)]">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div id="statusEmoji" class="w-10 h-10 rounded-xl flex items-center justify-center bg-blue-500/20 border border-blue-500/40 text-lg">⏳</div>
                        <div>
                            <span id="statusLabel" class="text-sm font-black block">بانتظار المنافسين</span>
                            <span id="statusTimer" class="text-xs text-gray-400">تحرك الكرة مستمر...</span>
                        </div>
                    </div>
                    <div class="px-3 py-1.5 rounded-xl bg-[rgba(212,175,55,0.06)] border border-[rgba(212,175,55,0.1)] text-[var(--gold)] font-bold text-sm">
                        اللاعبون: <span id="playerCount">0</span>
                    </div>
                </div>
            </div>

            <div class="relative mx-auto mb-6 w-[300px] h-[300px] rounded-[20px] overflow-hidden border-[3px] border-[rgba(212,175,55,0.25)] bg-black shadow-2xl">
                <div id="ball" class="absolute w-5 h-5 bg-white rounded-full z-[100] shadow-[0_0_15px_#fff]"></div>
                <div id="countdownOverlay" class="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-[110] hidden">
                    <span id="bigTimer" class="text-8xl font-black text-[var(--gold)]"></span>
                </div>
                <canvas id="gameCanvas" width="600" height="600" class="w-full h-full"></canvas>
            </div>

            <div id="betSection" class="rounded-2xl p-5 border border-[rgba(212,175,55,0.15)] bg-[rgba(212,175,55,0.04)] mb-6">
                <input type="number" id="betInput" value="1000" class="w-full text-center text-2xl font-black mb-4 p-4 rounded-2xl bg-black border-2 border-[rgba(212,175,55,0.2)] text-[var(--gold)] outline-none">
                <button id="joinBtn" class="gold-btn w-full py-4 rounded-2xl text-lg">دخول الميدان ⚔️</button>
            </div>

            <div id="playersList" class="space-y-2 mb-6 max-h-[200px] overflow-y-auto"></div>
        </div>
    </div>

    <div id="winnerOverlay" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[2000] hidden flex flex-col items-center justify-center text-center">
        <div id="winnerColorBox" class="w-24 h-24 rounded-3xl border-4 border-[var(--gold)] mb-6 shadow-[0_0_50px_rgba(212,175,55,0.3)]"></div>
        <p class="text-[rgba(212,175,55,0.6)] font-bold">🏆 بطل الميدان</p>
        <h2 id="winnerName" class="text-3xl font-black text-white mb-2"></h2>
        <h1 id="winnerPrize" class="text-5xl font-black text-[var(--gold)] mb-8"></h1>
    </div>

    <script>
        const DB_PATH = "https://sarab-app-84448-default-rtdb.firebaseio.com/global_v6";
        const INITIAL_GIFT = 100000;
        
        // التحقق من أول دخول
        if(!localStorage.getItem("has_joined_before")) {
            localStorage.setItem("user_bal", INITIAL_GIFT);
            localStorage.setItem("has_joined_before", "true");
        }

        let myId = localStorage.getItem("tg_user_id") || "P" + Math.floor(Math.random() * 9999);
        localStorage.setItem("tg_user_id", myId);

        let myBal = parseInt(localStorage.getItem("user_bal")) || 0;
        let gameState = "waiting";
        let players = [];
        let isPhysicsRunning = false;
        let ballX = 150, ballY = 150, ballVX = 2, ballVY = 2;

        const balDisp = document.getElementById("balanceDisplay");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const ball = document.getElementById("ball");

        function updateBalance(amt) {
            myBal = amt;
            localStorage.setItem("user_bal", amt);
            balDisp.innerText = amt.toLocaleString();
        }
        updateBalance(myBal);

        async function sync() {
            try {
                const res = await fetch(`${DB_PATH}.json`);
                const data = await res.json();
                if (!data) {
                    await resetGameData(); // تهيئة في حال كانت الداتا فارغة
                    return;
                }

                players = data.players ? Object.values(data.players) : [];
                gameState = data.state || "waiting";
                
                document.getElementById("playerCount").innerText = players.length;
                updateUI(data);
                drawMap();

                // منطق الانتقال بين الحالات
                handleLogic(data);
            } catch (e) { console.error("Sync Error:", e); }
        }

        function handleLogic(data) {
            // 1. حالة الانتظار (تحريك الكرة العشوائي)
            if (gameState === "waiting" || gameState === "counting") {
                if (!isPhysicsRunning) moveBallIdle();
                
                // بدء العد إذا وصل عدد اللاعبين لـ 2
                if (players.length >= 2 && gameState === "waiting") {
                    updateDB({ state: "counting", timer: 10, startTime: Date.now() });
                }
            }

            // 2. حالة العد التنازلي
            if (gameState === "counting") {
                const elapsed = Math.floor((Date.now() - data.startTime) / 1000);
                const currentTimer = 10 - elapsed;
                
                if (currentTimer <= 0) {
                    startPhysicsProcess();
                } else {
                    document.getElementById("bigTimer").innerText = currentTimer;
                    // تحديث التايمر فقط في الـ UI لتوفير الـ Requests
                }
            }

            // 3. حالة الانتهاء وعرض الفائز
            if (gameState === "finished" && data.winner && !document.getElementById("winnerOverlay").classList.contains("flex")) {
                showWinnerUI(data);
            }
        }

        function moveBallIdle() {
            if (gameState !== "waiting" && gameState !== "counting") return;
            ballX += ballVX; ballY += ballVY;
            if (ballX <= 0 || ballX >= 280) ballVX *= -1;
            if (ballY <= 0 || ballY >= 280) ballVY *= -1;
            ball.style.left = ballX + "px";
            ball.style.top = ballY + "px";
            requestAnimationFrame(moveBallIdle);
        }

        async function startPhysicsProcess() {
            if (myId === players[0].id) { // أول لاعب هو المتحكم بالمنطق لتجنب التكرار
                const seed = Math.random();
                await updateDB({ state: "playing", seed: seed });
            }
        }

        function drawMap() {
            ctx.clearRect(0, 0, 600, 600);
            if (players.length === 0) {
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, 600, 600);
                return;
            }
            const total = players.reduce((s, p) => s + p.amount, 0);
            let curX = 0, curY = 0, w = 600, h = 600;
            players.forEach((p, i) => {
                const ratio = p.amount / total;
                ctx.fillStyle = p.color;
                if (i % 2 === 0) {
                    let sW = (i === players.length - 1) ? w : w * ratio;
                    ctx.fillRect(curX, curY, sW, h);
                    p.box = { x1: curX, y1: curY, x2: curX+sW, y2: curY+h };
                    curX += sW; w -= sW;
                } else {
                    let sH = (i === players.length - 1) ? h : h * ratio;
                    ctx.fillRect(curX, curY, w, sH);
                    p.box = { x1: curX, y1: curY, x2: curX, y2: curY+sH }; // Simplified
                    curY += sH; h -= sH;
                }
            });
        }

        function updateUI(data) {
            const list = document.getElementById("playersList");
            list.innerHTML = players.map(p => `
                <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border-r-4 mb-2" style="border-color: ${p.color}">
                    <span class="font-bold text-sm">${p.name} ${p.id === myId ? '(أنت)' : ''}</span>
                    <span class="text-[var(--gold)] font-black text-sm">${p.amount.toLocaleString()} ⭐</span>
                </div>
            `).join('');

            const overlay = document.getElementById("countdownOverlay");
            if (gameState === "counting") overlay.classList.remove("hidden");
            else overlay.classList.add("hidden");

            const statusLabel = document.getElementById("statusLabel");
            const btn = document.getElementById("joinBtn");
            
            if(gameState === "waiting") {
                statusLabel.innerText = "بانتظار لاعبين (2 لتبدأ)";
                statusLabel.className = "text-sm font-black block text-blue-500";
                btn.disabled = false;
            } else if(gameState === "counting") {
                statusLabel.innerText = "يغلق الميدان قريباً...";
                statusLabel.className = "text-sm font-black block text-yellow-500";
                btn.disabled = false;
            } else {
                statusLabel.innerText = "المعركة جارية حالياً";
                statusLabel.className = "text-sm font-black block text-red-500";
                btn.disabled = true;
            }
        }

        async function showWinnerUI(data) {
            const over = document.getElementById("winnerOverlay");
            document.getElementById("winnerName").innerText = data.winnerName;
            document.getElementById("winnerPrize").innerText = "+" + data.prize?.toLocaleString() + " ⭐";
            document.getElementById("winnerColorBox").style.backgroundColor = data.winnerColor;
            over.classList.remove("hidden");
            over.classList.add("flex");
            
            if (data.winner === myId) {
                updateBalance(myBal + data.prize);
                // تأثير بسيط
                for(let i=0; i<30; i++) createConfetti();
            }
            
            setTimeout(async () => {
                over.classList.add("hidden");
                over.classList.remove("flex");
                if (myId === players[0]?.id) await resetGameData();
            }, 5000);
        }

        async function resetGameData() {
            await fetch(`${DB_PATH}.json`, {
                method: "PUT",
                body: JSON.stringify({
                    state: "waiting",
                    players: {},
                    winner: null,
                    prize: 0,
                    seed: 0
                })
            });
        }

        document.getElementById("joinBtn").onclick = async () => {
            const amt = parseInt(document.getElementById("betInput").value);
            if (amt > myBal || amt <= 0) return alert("الرصيد غير كافٍ!");
            
            updateBalance(myBal - amt);
            const pData = {
                id: myId,
                name: "المحارب " + myId.substr(1, 4),
                amount: amt,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`
            };
            await fetch(`${DB_PATH}/players/${myId}.json`, { method: "PUT", body: JSON.stringify(pData) });
        };

        async function updateDB(obj) {
            await fetch(`${DB_PATH}.json`, { method: "PATCH", body: JSON.stringify(obj) });
        }

        function createConfetti() {
            const c = document.createElement("div");
            c.className = "confetti-piece";
            c.style.left = Math.random()*100+"vw";
            c.style.width = "8px"; c.style.height = "8px";
            c.style.backgroundColor = ["#D4AF37", "#fff", "#CD7F32"][Math.floor(Math.random()*3)];
            c.style.animationDuration = (Math.random()*2+2)+"s";
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }

        setInterval(sync, 1000);
    </script>
</body>
</html>
