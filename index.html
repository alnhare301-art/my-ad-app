<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تعيين رمز الحالة</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .emoji-preview {
      font-size: 60px;
      margin-bottom: 12px;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 13.5px;
      color: var(--tg-theme-hint-color, #94a3b8);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    button {
      background-color: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active {
      opacity: 0.85;
      transform: scale(0.98);
    }
    #status {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji-preview">🎰</div>
    <h2>تثبيت رمز الحالة</h2>
    <p>اضغط بالأسفل لتعيين هذا الرمز في شريط حسابك الشخصي (لمشتركي Premium).</p>
    <button id="setBtn" onclick="applyStatus()">تعيين الرمز 🎰</button>
    <div id="status"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const EMOJI_ID = "6033009431044692127";

    function applyStatus() {
      const statusDiv = document.getElementById("status");
      const btn = document.getElementById("setBtn");

      if (tg.isVersionAtLeast && !tg.isVersionAtLeast('7.0')) {
        statusDiv.style.color = "#f59e0b";
        statusDiv.innerText = "يرجى تحديث تطبيق تيليجرام لآخر إصدار.";
        return;
      }

      btn.disabled = true;
      btn.style.opacity = "0.6";

      if (typeof tg.setEmojiStatus === 'function') {
        tg.setEmojiStatus(EMOJI_ID, {}, (success) => {
          btn.disabled = false;
          btn.style.opacity = "1";
          if (success) {
            statusDiv.style.color = "#22c55e";
            statusDiv.innerText = "تم تعيين الرمز بنجاح!";
            setTimeout(() => tg.close(), 1200);
          } else {
            statusDiv.style.color = "#ef4444";
            statusDiv.innerText = "تم إلغاء الطلب.";
          }
        });
      } else if (typeof tg.requestEmojiStatusAccess === 'function') {
        tg.requestEmojiStatusAccess((granted) => {
          if (granted) {
            tg.setEmojiStatus(EMOJI_ID, {}, (success) => {
              btn.disabled = false;
              btn.style.opacity = "1";
              if (success) {
                statusDiv.style.color = "#22c55e";
                statusDiv.innerText = "تم تعيين الرمز بنجاح!";
                setTimeout(() => tg.close(), 1200);
              }
            });
          } else {
            btn.disabled = false;
            btn.style.opacity = "1";
            statusDiv.style.color = "#ef4444";
            statusDiv.innerText = "لم يتم منح الصلاحية.";
          }
        });
      } else {
        btn.disabled = false;
        btn.style.opacity = "1";
        statusDiv.style.color = "#ef4444";
        statusDiv.innerText = "الميزة غير مدعومة في جهازك الحالي.";
      }
    }
  </script>
</body>
</html>
