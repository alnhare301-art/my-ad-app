<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Roulette - Clean Start</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #05070a; --gold: #fbc531; --cyan: #00d2d3; --pink: #ef5777; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        .header { width: 100%; padding: 15px; background: #10141d; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e272e; }
        .balance-chip { background: #000; padding: 6px 18px; border-radius: 50px; border: 2px solid var(--gold); color: var(--gold); font-weight: 900; }

        /* ساحة اللعبة */
        .board-container { margin: 40px auto; perspective: 1000px; }
        .game-board { 
            position: relative; width: 300px; height: 300px; 
            background: #111; border: 5px solid #222; border-radius: 20px; 
            overflow: hidden; transition: 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        #ball { 
            position: absolute; width: 22px; height: 22px; 
            background: #fff; border-radius: 50%; 
            box-shadow: 0 0 20px #fff; z-index: 100; display: none;
        }

        .countdown-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 90px; font-weight: 900; z-index: 50; text-shadow: 0 0 20px #000;
        }

        .controls { width: 90%; max-width: 400px; background: #10141d; padding: 25px; border-radius: 25px; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #000; color: white; font-size: 20px; margin-bottom: 15px; text-align: center; }
        
        .btn-join { width: 100%; padding: 18px; border-radius: 15px; border: none; background: linear-gradient(45deg, var(--cyan), var(--pink)); color: white; font-weight: 900; font-size: 18px; cursor: pointer; }
        .btn-join:disabled { opacity: 0.3; filter: grayscale(1); }

        #winner-popup { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.96); 
            display: none; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 1000; 
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900; color: var(--cyan);">GLOBAL</div>
        <div class="balance-chip">⭐ <span id="balance-val">100,000</span></div>
    </div>

    <div class="board-container">
        <div id="board" class="game-board">
            <div id="ball"></div>
            <div id="countdown-display" class="countdown-overlay"></div>
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>
    </div>

    <div class="controls">
        <div id="info-status" style="margin-bottom:10px; color:var(--gold); font-weight: bold;">بانتظار لاعبين (0/2)</div>
        <input type="number" id="bet-input" value="1000" min="100">
        <button id="join-btn" class="btn-join" onclick="handleJoin()">مشاركة في الجولة 🚀</button>
    </div>

    <div id="winner-popup">
        <div id="winner-content" style="text-align:center;"></div>
        <p style="margin-top:20px; color:#666;">سيتم تصفير الجولة تلقائياً...</p>
    </div>

    <script>
        const DB_URL = "https://sarab-app-84448-default-rtdb.firebaseio.com/global_v4";
        let myId = "UID_" + Math.floor(Math.random() * 9999);
        let myBalance = parseInt(localStorage.getItem('g_bal')) || 100000;
        let players = [];
        let isMoving = false;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const ball = document.getElementById('ball');
        const board = document.getElementById('board');

        function updateBalance() {
            document.getElementById('balance-val').innerText = myBalance.toLocaleString();
            localStorage.setItem('g_bal', myBalance);
        }
        updateBalance();

        async function syncGame() {
            try {
                const r = await fetch(`${DB_URL}.json`);
                const data = await r.json();

                if (!data || !data.players) {
                    players = [];
                    resetUI();
                    return;
                }

                players = Object.values(data.players);
                const state = data.state || "waiting";

                if (state === "waiting") {
                    document.getElementById('info-status').innerText = `المشاركون (${players.length}/2)`;
                    if (players.length >= 2 && players[0].id === myId) startTimer();
                }

                if (state === "counting") {
                    document.getElementById('countdown-display').innerText = data.timer || "";
                }

                if (state === "playing" && !isMoving) {
                    startPhysics(data.seed || 0.5);
                }

                drawMap();
            } catch (e) {}
        }

        function drawMap() {
            const total = players.reduce((s, p) => s + p.amount, 0);
            ctx.clearRect(0, 0, 300, 300);
            if (total === 0) return;
            let currentX = 0;
            players.forEach(p => {
                const w = (p.amount / total) * 300;
                ctx.fillStyle = p.color;
                ctx.fillRect(currentX, 0, w, 300);
                currentX += w;
            });
        }

        function resetUI() {
            ctx.clearRect(0, 0, 300, 300);
            document.getElementById('info-status').innerText = "بانتظار لاعبين (0/2)";
            document.getElementById('countdown-display').innerText = "";
            board.style.transform = "scale(1)";
            ball.style.display = "none";
            isMoving = false;
        }

        async function handleJoin() {
            const val = parseInt(document.getElementById('bet-input').value);
            if (val > myBalance) return alert("الرصيد لا يكفي");

            myBalance -= val;
            updateBalance();
            document.getElementById('join-btn').disabled = true;

            const pData = { id: myId, amount: val, color: `hsl(${Math.random()*360},70%,50%)`, name: "لاعب " + myId.split('_')[1] };
            await fetch(`${DB_URL}/players/${myId}.json`, { method: 'PUT', body: JSON.stringify(pData) });
        }

        async function startTimer() {
            await fetch(`${DB_URL}/state.json`, { method: 'PUT', body: JSON.stringify("counting") });
            let sec = 5;
            let iv = setInterval(async () => {
                await fetch(`${DB_URL}/timer.json`, { method: 'PUT', body: JSON.stringify(sec) });
                sec--;
                if (sec < 0) {
                    clearInterval(iv);
                    await fetch(`${DB_URL}.json`, { method: 'PATCH', body: JSON.stringify({ state: "playing", seed: Math.random() }) });
                }
            }, 1000);
        }

        function startPhysics(seed) {
            isMoving = true;
            ball.style.display = "block";
            document.getElementById('countdown-display').innerText = "";
            
            let px = 150, py = 150;
            let vx = (seed * 35) + 15;
            let vy = (1 - seed) * 35 + 15;
            let fric = 0.984;

            function frame() {
                px += vx; py += vy;
                if (px <= 0 || px >= 278) vx *= -1;
                if (py <= 0 || py >= 278) vy *= -1;
                vx *= fric; vy *= fric;
                ball.style.left = px + 'px';
                ball.style.top = py + 'px';

                if (Math.abs(vx) < 8) board.style.transform = "scale(1.35)";

                if (Math.abs(vx) > 0.18) requestAnimationFrame(frame);
                else conclude(px);
            }
            frame();
        }

        async function conclude(finalX) {
            const total = players.reduce((s, p) => s + p.amount, 0);
            let curX = 0;
            let win = players[0];
            players.forEach(p => {
                const w = (p.amount / total) * 300;
                if (finalX >= curX && finalX <= curX + w) win = p;
                curX += w;
            });

            document.getElementById('winner-content').innerHTML = `
                <div style="width:90px; height:90px; background:${win.color}; border-radius:50%; margin:0 auto 15px; border:4px solid #fff;"></div>
                <h2>الفائز: ${win.name}</h2>
                <h1 style="color:var(--gold)">+${total.toLocaleString()} ⭐</h1>
            `;
            document.getElementById('winner-popup').style.display = "flex";

            if (win.id === myId) {
                myBalance += total;
                updateBalance();
                confetti();
            }

            // تصفير كل شيء (حذف الخريطة والمشاركين)
            if (players[0].id === myId) {
                setTimeout(async () => {
                    await fetch(`${DB_URL}.json`, { method: 'DELETE' });
                    location.reload(); 
                }, 7000);
            }
        }

        setInterval(syncGame, 1000);
    </script>
</body>
</html>
