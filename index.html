<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - نظام اللاعبين الحقيقيين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #0d1117; --gold: #f1c40f; --cyan: #00f2ff; --pink: #ff007a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; padding: 15px; background: #161b22; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; }
        .balance { background: #000; padding: 5px 15px; border-radius: 50px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; }

        .game-board { position: relative; width: 320px; height: 320px; margin: 30px auto; background: #1c2128; border: 5px solid #30363d; border-radius: 25px; overflow: hidden; transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #ball { position: absolute; width: 18px; height: 18px; background: white; border-radius: 50%; box-shadow: 0 0 15px white; z-index: 10; display: none; }

        .controls { width: 90%; max-width: 400px; background: #161b22; padding: 20px; border-radius: 20px; border: 1px solid #30363d; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 16px; margin: 8px 0; text-align: center; font-weight: bold; }
        
        .btn-join { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(45deg, var(--cyan), var(--pink)); color: white; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn-join:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

        .status-msg { font-size: 18px; font-weight: 800; color: var(--cyan); margin-bottom: 10px; text-align: center; min-height: 27px; }
        
        #winner-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900; letter-spacing: 1px;">SARAB MULTIPLAYER</div>
        <div class="balance">⭐ <span id="balance">100,000</span></div>
    </div>

    <div id="board" class="game-board">
        <div id="ball"></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls">
        <div id="status" class="status-msg">في انتظار المتسابقين...</div>
        <input type="text" id="username" placeholder="أدخل اسمك هنا">
        <input type="number" id="bet-input" value="1000" min="100">
        <button id="join-btn" class="btn-join" onclick="joinGame()">دخول السحب الجماعي 🌍</button>
        <p id="player-count" style="font-size: 12px; color: #8b949e; text-align: center; margin-top: 10px;">المشاركون: 0 / 20</p>
    </div>

    <div id="winner-popup">
        <h1 style="color: var(--gold); font-size: 35px;">🏆 الفائز بالجولة!</h1>
        <div id="winner-info" style="text-align: center;"></div>
        <button class="btn-join" style="width: 200px; margin-top: 30px;" onclick="location.reload()">جولة جديدة</button>
    </div>

    <script>
        // رابط Firebase الخاص بك
        const DB_BASE = "https://sarab-app-84448-default-rtdb.firebaseio.com/live_game";
        
        let myId = "id_" + Math.floor(Math.random() * 10000);
        let balance = parseInt(localStorage.getItem('sarab_bal')) || 100000;
        let players = [];
        let gameFinished = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ballEl = document.getElementById('ball');

        document.getElementById('balance').innerText = balance.toLocaleString();

        async function sync() {
            if (gameFinished) return;
            const res = await fetch(`${DB_BASE}.json`);
            const data = await res.json();
            
            if (data && data.players) {
                players = Object.values(data.players);
                updateDisplay();
                
                // بدء العد التنازلي فقط إذا كان هناك 2 أو أكثر
                if (players.length >= 2) {
                    handleCountdown(data.startTime);
                } else {
                    document.getElementById('status').innerText = "في انتظار لاعب آخر...";
                }
            }
        }

        function updateDisplay() {
            document.getElementById('player-count').innerText = `المشاركون: ${players.length} / 20`;
            const total = players.reduce((s, p) => s + p.amount, 0);
            let currentX = 0;
            ctx.clearRect(0,0,320,320);
            players.forEach(p => {
                const width = (p.amount / total) * 320;
                ctx.fillStyle = p.color;
                ctx.fillRect(currentX, 0, width, 320);
                
                // رسم اسم اللاعب
                ctx.fillStyle = "white";
                ctx.font = "bold 12px Cairo";
                ctx.fillText(p.name, currentX + 5, 310);
                
                currentX += width;
            });
        }

        async function joinGame() {
            const name = document.getElementById('username').value || "لاعب مجهول";
            const amt = parseInt(document.getElementById('bet-input').value);
            
            if (amt > balance) return alert("رصيدك لا يكفي!");

            balance -= amt;
            localStorage.setItem('sarab_bal', balance);
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('join-btn').disabled = true;

            const myData = {
                id: myId,
                name: name,
                amount: amt,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`
            };

            await fetch(`${DB_BASE}/players/${myId}.json`, { method: 'PUT', body: JSON.stringify(myData) });
            
            // إذا كنت أول من جعل العدد 2، حدد وقت البداية للجميع
            if (players.length === 1) {
                const startAt = Date.now() + 10000; // بعد 10 ثواني
                await fetch(`${DB_BASE}/startTime.json`, { method: 'PUT', body: JSON.stringify(startAt) });
            }
        }

        function handleCountdown(startTime) {
            if (!startTime) return;
            const now = Date.now();
            const diff = Math.ceil((startTime - now) / 1000);

            if (diff > 0) {
                document.getElementById('status').innerText = `تبدأ الجولة خلال: ${diff}`;
            } else if (!gameFinished) {
                runPhysics();
            }
        }

        function runPhysics() {
            gameFinished = true;
            document.getElementById('status').innerText = "جاري السحب...";
            ballEl.style.display = 'block';
            
            let x = 160, y = 160;
            let vx = 15 + Math.random() * 5;
            let vy = 12 + Math.random() * 5;

            function animate() {
                x += vx; y += vy;
                if (x <= 0 || x >= 300) vx *= -1;
                if (y <= 0 || y >= 300) vy *= -1;
                vx *= 0.988; vy *= 0.988;

                ballEl.style.left = x + 'px';
                ballEl.style.top = y + 'px';

                if (Math.abs(vx) < 5) document.getElementById('board').style.transform = "scale(1.2)";

                if (Math.abs(vx) > 0.3) {
                    requestAnimationFrame(animate);
                } else {
                    finishGame(x);
                }
            }
            animate();
        }

        function finishGame(finalX) {
            const total = players.reduce((s, p) => s + p.amount, 0);
            let currentX = 0;
            let winner = players[0];

            players.forEach(p => {
                const width = (p.amount / total) * 320;
                if (finalX >= currentX && finalX <= currentX + width) winner = p;
                currentX += width;
            });

            document.getElementById('winner-popup').style.display = 'flex';
            document.getElementById('winner-info').innerHTML = `
                <div style="width:100px; height:100px; background:${winner.color}; border-radius:50%; margin:20px auto; border:5px solid white;"></div>
                <h2 style="font-size:28px;">${winner.name}</h2>
                <h1 style="color:var(--gold)">+${total.toLocaleString()} ⭐</h1>
            `;
            
            confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
            
            if (winner.id === myId) {
                balance += total;
                localStorage.setItem('sarab_bal', balance);
            }
            
            // تنظيف السيرفر للجولة القادمة (اختياري بعد 5 ثواني)
            if (players[0].id === myId) {
                setTimeout(() => fetch(`${DB_BASE}.json`, { method: 'DELETE' }), 5000);
            }
        }

        setInterval(sync, 1000);
    </script>
</body>
</html>
