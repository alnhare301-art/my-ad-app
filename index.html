<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA V2 - الميدان الهندسي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold2: #f0d060;
            --dark: #060606;
            --card: #111111;
            --border: rgba(212,175,55,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark);
            color: white;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        .wrapper { position: relative; z-index: 1; padding: 12px; max-width: 420px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .header-brand {
            font-size: 16px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--gold2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bal-amount { font-size: 18px; font-weight: 900; color: var(--gold); }

        .status-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-state { font-size: 13px; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .status-dot.counting { background: #f59e0b; animation: blink 0.8s infinite; }
        .status-dot.playing { background: #10b981; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .player-count {
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 10px;
            padding: 6px 14px;
        }
        .player-count .num { font-size: 18px; font-weight: 900; color: var(--gold); text-align: center; }

        .arena-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            max-width: 360px;
            margin: 0 auto 12px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid rgba(212,175,55,0.3);
            background: #0c0c0c;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        #arenaCanvas { width: 100%; height: 100%; display: block; }

        .countdown-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(1px);
            z-index: 20;
        }

        .countdown-num {
            font-size: 90px;
            font-weight: 950;
            color: white;
            text-shadow: 0 0 25px rgba(0,0,0,0.9);
        }

        .players-list {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 12px;
            max-height: 130px;
            overflow-y: auto;
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 13px;
        }

        .player-info { display: flex; align-items: center; gap: 8px; }
        .player-avatar { width: 28px; height: 28px; border-radius: 50%; background: #333; object-fit: cover; }

        .controls { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
        .bet-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .bet-btn {
            flex: 1; background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.15);
            color: var(--gold); padding: 10px 0; border-radius: 10px; font-size: 12px; font-weight: 700;
            cursor: pointer;
        }

        #betInput {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.2);
            padding: 12px; border-radius: 12px; color: var(--gold); font-size: 20px;
            font-weight: 900; text-align: center; margin-bottom: 12px;
            outline: none;
        }

        #joinBtn {
            width: 100%; background: linear-gradient(135deg, var(--gold), #b8960c); padding: 15px;
            border-radius: 14px; border: none; color: #000; font-weight: 900; font-size: 15px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(212,175,55,0.2);
        }
        #joinBtn:disabled { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }

        .winner-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.96); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center;
        }
        .winner-avatar { width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--gold); margin: 15px 0; }
        .winner-name { font-size: 24px; font-weight: 900; }
        .winner-prize { font-size: 45px; font-weight: 900; color: var(--gold); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <div class="header-brand">ARENA V2</div>
        <div class="bal-amount" id="balDisplay">100,000 ⭐</div>
    </div>

    <div class="status-bar">
        <div class="status-info">
            <div class="status-state">
                <div class="status-dot waiting" id="statusDot"></div>
                <span id="statusLabel">بانتظار دخول الأبطال للميدان...</span>
            </div>
        </div>
        <div class="player-count">
            <div class="num" id="playerCount">0 لاعبين</div>
        </div>
    </div>

    <div class="arena-container">
        <canvas id="arenaCanvas" width="600" height="600"></canvas>
        <div class="countdown-overlay" id="countdownOverlay">
            <div class="countdown-num" id="countdownText">10</div>
        </div>
    </div>

    <div class="players-list" id="playersList"></div>

    <div class="controls">
        <div class="bet-row">
            <button class="bet-btn" onclick="setBet(1000)">1K</button>
            <button class="bet-btn" onclick="setBet(5000)">5K</button>
            <button class="bet-btn" onclick="setBet(10000)">10K</button>
        </div>
        <input type="number" id="betInput" value="1000">
        <button id="joinBtn" onclick="joinGame()">دخول ساحة المواجهة ⚔️</button>
    </div>
</div>

<div class="winner-overlay" id="winnerOverlay">
    <div style="font-size:60px;">🏆</div>
    <img src="" class="winner-avatar" id="winnerAvatar">
    <div class="winner-name" id="winnerName">-</div>
    <div class="winner-prize" id="winnerPrize">⭐ 0</div>
    <div style="color:#555; font-size:12px; margin-top:10px;">جاري التجهيز التلقائي لجولة جديدة...</div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if(tg) { tg.ready(); tg.expand(); }

    // الاتصال تلقائياً بسيرفر البايثون المستضيف للعبة
    const socket = io(); 

    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23555'><circle cx='50' cy='35' r='20'/><path d='M20,85 C20,60 80,60 80,85 Z'/></svg>";
    
    let myId = tg?.initDataUnsafe?.user ? `tg_${tg.initDataUnsafe.user.id}` : "P_" + Math.floor(Math.random()*99999);
    let myName = tg?.initDataUnsafe?.user?.first_name || "محارب " + myId.slice(-3);
    let myAvatar = tg?.initDataUnsafe?.user?.photo_url || DEFAULT_AVATAR;

    if(!localStorage.getItem("arena_bal_v2")) localStorage.setItem("arena_bal_v2", "100000");
    let myBal = parseInt(localStorage.getItem("arena_bal_v2"));

    let players = [], isSpinning = false, ballX = 300, ballY = 300, showBall = false;

    function savebal() { localStorage.setItem("arena_bal_v2", myBal); }
    function updateUI() { document.getElementById("balDisplay").innerText = myBal.toLocaleString() + " ⭐"; }
    function setBet(v) { document.getElementById("betInput").value = v; }

    function getSeeds(pList) {
        let total = pList.reduce((s, p) => s + p.amount, 0);
        return pList.map((p) => {
            let hash = 0;
            for (let i = 0; i < p.id.length; i++) hash = p.id.charCodeAt(i) + ((hash << 5) - hash);
            let x = Math.abs(Math.sin(hash + 1)) * 340 + 130;
            let y = Math.abs(Math.cos(hash + 2)) * 340 + 130;
            return { id: p.id, name: p.name, amount: p.amount, ratio: total > 0 ? (p.amount / total) : 0, x, y, color: p.color };
        });
    }

    function drawMap(pList, zoom = 1, tX = 300, tY = 300) {
        const canvas = document.getElementById("arenaCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 600, 600);

        ctx.save();
        if(zoom > 1) {
            ctx.translate(300, 300); ctx.scale(zoom, zoom); ctx.translate(-tX, -tY);
        }

        if(pList.length === 0) {
            ctx.fillStyle = "#0c0c0c"; ctx.fillRect(0, 0, 600, 600);
            ctx.restore(); return;
        }

        let seeds = getSeeds(pList);
        let imgData = ctx.createImageData(600, 600);
        let d = imgData.data;

        for (let y = 0; y < 600; y++) {
            for (let x = 0; x < 600; x++) {
                let minDist = Infinity, closest = null;
                for (let i = 0; i < seeds.length; i++) {
                    let s = seeds[i];
                    let dist = ((x - s.x)**2 + (y - s.y)**2) / (s.ratio**2 * 12 + 0.05);
                    if(dist < minDist) { minDist = dist; closest = s; }
                }
                if(closest) {
                    let idx = (y * 600 + x) * 4;
                    let c = closest.color;
                    d[idx] = parseInt(c.slice(1,3), 16);
                    d[idx+1] = parseInt(c.slice(3,5), 16);
                    d[idx+2] = parseInt(c.slice(5,7), 16);
                    d[idx+3] = 255;
                }
            }
        }
        ctx.putImageData(imgData, 0, 0);

        seeds.forEach((s) => {
            ctx.save();
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.beginPath(); ctx.arc(s.x, s.y, 38, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(s.name.substring(0,8), s.x, s.y - 4);
            ctx.fillStyle = "#D4AF37"; ctx.font = "bold 13px sans-serif";
            ctx.fillText(Math.round(s.ratio * 100) + "%", s.x, s.y + 14);
            ctx.restore();
        });

        if(showBall) {
            ctx.save();
            ctx.shadowBlur = 15; ctx.shadowColor = "#fff";
            ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(ballX, ballY, 12, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }
        ctx.restore();
    }

    function runPhysics(seed) {
        if(isSpinning) return; isSpinning = true; showBall = true;
        document.getElementById("countdownOverlay").style.display = "none";
        document.getElementById("statusDot").className = "status-dot playing";
        document.getElementById("statusLabel").innerText = "جاري تدوير الكرة وسحب الفائز الحقيقي... 🎯";

        ballX = 200 + (seed * 200); ballY = 200 + ((seed * 3 % 1) * 200);
        let angle = seed * Math.PI * 2;
        let speed = 35 + (seed * 15);
        let vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed;
        let zoom = 1;

        function frame() {
            ballX += vx; ballY += vy;
            if(ballX <= 15 || ballX >= 585) vx *= -1;
            if(ballY <= 15 || ballY >= 585) vy *= -1;
            vx *= 0.985; vy *= 0.985;

            let s = Math.sqrt(vx*vx + vy*vy);
            if(s < 4) zoom = Math.min(1.8, zoom + 0.03);

            drawMap(players, zoom, ballX, ballY);

            if(s > 0.22) {
                requestAnimationFrame(frame);
            } else {
                isSpinning = false;
            }
        }
        requestAnimationFrame(frame);
    }

    function joinGame() {
        let amt = parseInt(document.getElementById("betInput").value) || 0;
        if(amt <= 0 || amt > myBal) { alert("رصيدك الحالي لا يسمح بالرهان!"); return; }

        myBal -= amt; savebal(); updateUI();
        
        // إرسال طلب الرهان عبر السوكيت فوراً
        socket.emit("join", { id: myId, name: myName, avatar: myAvatar, amount: amt });
    }

    // 📩 الاستماع لأوامر خادم بايثون (Flask-SocketIO)
    socket.on("gameUpdate", (state) => {
        if(isSpinning) return;
        players = state.players;
        document.getElementById("playerCount").innerText = players.length + " محاربين";

        if(state.gameState === "waiting") {
            document.getElementById("statusDot").className = "status-dot waiting";
            document.getElementById("statusLabel").innerText = "بانتظار دخول الأبطال للميدان...";
            document.getElementById("countdownOverlay").style.display = "none";
            document.getElementById("joinBtn").disabled = false;
            showBall = false;
            drawMap(players, 1);
        }

        let listHtml = "";
        players.forEach(p => {
            listHtml += `<div class="player-row"><div class="player-info"><img src="${p.avatar}" class="player-avatar"><span>${p.name}</span></div><div><b>${p.amount.toLocaleString()} ⭐</b></div></div>`;
        });
        document.getElementById("playersList").innerHTML = listHtml;
    });

    socket.on("countdown", (count) => {
        if(isSpinning) return;
        document.getElementById("statusDot").className = "status-dot counting";
        document.getElementById("statusLabel").innerText = `متبقي على إغلاق الميدان وانطلاق الكرة: ${count} ثانية`;
        document.getElementById("countdownOverlay").style.display = "flex";
        document.getElementById("countdownText").innerText = count;
    });

    socket.on("gameStart", (data) => {
        players = data.players;
        document.getElementById("joinBtn").disabled = true;
        runPhysics(data.seed);
    });

    socket.on("gameWinner", (data) => {
        setTimeout(() => {
            document.getElementById("winnerOverlay").style.display = "flex";
            document.getElementById("winnerAvatar").src = data.winner.avatar;
            document.getElementById("winnerName").innerText = `البطل الفائز: ${data.winner.name}`;
            document.getElementById("winnerPrize").innerText = `+${data.pot.toLocaleString()} ⭐`;

            if(data.winner.id === myId) {
                myBal += data.pot; savebal(); updateUI();
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            }
        }, 1000);
    });

    socket.on("resetGame", () => {
        document.getElementById("winnerOverlay").style.display = "none";
    });

    updateUI();
</script>
</body>
</html>
