<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة روليت سراب - النسخة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #6366f1; 
            --accent: #f687b3; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --clr: #222327; /* لون شريط التنقل */
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 100px; overflow-x: hidden; }
        
        /* الشريط العلوي */
        .ticker-wrap { background: linear-gradient(90deg, var(--primary), #a855f7); padding: 5px 0; position: fixed; top: 0; width: 100%; z-index: 2000; height: 50px; display: flex; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.4); }
        .ticker { white-space: nowrap; overflow: hidden; flex-grow: 1; font-weight: bold; }
        .ticker-text { display: inline-block; animation: ticker 20s linear infinite; padding-right: 50px; }
        .ticker-btn { background: white; color: var(--primary); padding: 5px 15px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: bold; margin: 0 10px; z-index: 2001; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .container { padding: 80px 15px 20px; text-align: center; }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 10px; }

        /* قسم الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 15px; border-bottom: 3px solid var(--accent); }
        .stat-card h3 { margin: 0; font-size: 22px; color: var(--primary); }
        .stat-card p { margin: 5px 0 0; font-size: 11px; color: #94a3b8; }

        .section-title { text-align: right; color: var(--accent); border-right: 4px solid var(--accent); padding-right: 10px; margin: 30px 0 15px; font-weight: bold; font-size: 18px; }

        /* الإعلانات */
        .ad-item { background: var(--card); padding: 15px; border-radius: 18px; border-right: 5px solid var(--primary); margin-bottom: 15px; text-align: right; animation: fadeIn 0.5s ease; }
        .ad-meta { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-top: 10px; border-top: 1px solid #334155; padding-top: 8px; }
        .btn-ad { background: var(--primary); color: white; padding: 10px; border-radius: 10px; text-decoration: none; display: block; text-align: center; margin-top: 12px; font-weight: bold; font-size: 13px; }

        /* المنشورات */
        .post-item { background: #161e2d; padding: 12px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2d3748; }
        .post-item span { font-size: 13px; color: #cbd5e1; }
        .btn-view { color: var(--primary); text-decoration: none; font-size: 12px; border: 1px solid var(--primary); padding: 4px 10px; border-radius: 8px; }

        /* --- شريط التنقل السحري (Magic Navigation) --- */
        .navigation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 70px;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 3000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .navigation ul {
            display: flex;
            width: 350px;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .navigation ul li {
            position: relative;
            width: 70px;
            height: 70px;
            z-index: 1;
        }
        .navigation ul li a {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            text-align: center;
            font-weight: 500;
            text-decoration: none;
        }
        .navigation ul li a .icon {
            position: relative;
            display: block;
            line-height: 75px;
            font-size: 1.5em;
            text-align: center;
            transition: 0.5s;
            color: var(--bg);
        }
        .navigation ul li.active a .icon {
            transform: translateY(-32px);
            color: #fff;
        }
        .navigation ul li a .text {
            position: absolute;
            color: var(--bg);
            font-weight: bold;
            font-size: 0.75em;
            letter-spacing: 0.05em;
            transition: 0.5s;
            opacity: 0;
            transform: translateY(20px);
        }
        .navigation ul li.active a .text {
            opacity: 1;
            transform: translateY(10px);
        }
        /* شكل المنحنى (الجوهرة) */
        .indicator {
            position: absolute;
            top: -50%;
            width: 70px;
            height: 70px;
            background: var(--primary);
            border-radius: 50%;
            border: 6px solid var(--bg);
            transition: 0.5s;
        }
        .indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -22px;
            width: 20px;
            height: 20px;
            background: transparent;
            border-top-right-radius: 20px;
            box-shadow: 1px -10px 0 0 var(--bg);
        }
        .indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -22px;
            width: 20px;
            height: 20px;
            background: transparent;
            border-top-left-radius: 20px;
            box-shadow: -1px -10px 0 0 var(--bg);
        }

        /* تحريك المنحنى بناءً على العنصر النشط */
        .navigation ul li:nth-child(1).active ~ .indicator { transform: translateX(calc(70px * 0)); }
        .navigation ul li:nth-child(2).active ~ .indicator { transform: translateX(calc(70px * 1)); }
        .navigation ul li:nth-child(3).active ~ .indicator { transform: translateX(calc(70px * 2)); }
        .navigation ul li:nth-child(4).active ~ .indicator { transform: translateX(calc(70px * 3)); }
        .navigation ul li:nth-child(5).active ~ .indicator { transform: translateX(calc(70px * 4)); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* توافق الشاشات الصغيرة لشريط التنقل */
        @media (max-width: 420px) {
            .navigation { width: 95%; bottom: 10px; }
            .navigation ul { width: 100%; justify-content: space-around; }
        }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <div class="ticker"><div class="ticker-text" id="ticker-content">جاري التحديث...</div></div>
        <a href="#" id="ticker-link" class="ticker-btn">مشاهدة 👁️</a>
    </div>

    <div class="container">
        <img src="https://files.catbox.moe/5s7y7a.png" class="logo">
        <h1 style="margin:0; font-size: 24px;">روليت سراب 🔥</h1>

        <div class="stats-grid">
            <div class="stat-card"><h3><span id="total-views">0</span></h3><p>إجمالي الزيارات</p></div>
            <div class="stat-card"><h3><span id="active-ads-count">0</span></h3><p>إعلانات نشطة</p></div>
        </div>

        <div class="section-title">🕒 إعلانات الروليت (النشطة)</div>
        <div id="ads-container">
            <p style="color: #64748b;">لا توجد إعلانات حالياً...</p>
        </div>

        <div class="section-title">🆕 أحدث المنشورات</div>
        <div id="posts-container">
            <p style="color: #64748b;">جاري جلب المنشورات...</p>
        </div>
    </div>

    <div class="navigation">
        <ul>
            <li class="list active">
                <a href="#">
                    <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
                    <span class="text">الرئيسية</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><ion-icon name="gift-outline"></ion-icon></span>
                    <span class="text">سحوباتي</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><ion-icon name="chatbubble-outline"></ion-icon></span>
                    <span class="text">الدعم</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><ion-icon name="camera-outline"></ion-icon></span>
                    <span class="text">صور</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><ion-icon name="settings-outline"></ion-icon></span>
                    <span class="text">إعدادات</span>
                </a>
            </li>
            <div class="indicator"></div>
        </ul>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <script>
        // برمجة تفاعل شريط التنقل
        const list = document.querySelectorAll('.list');
        function activeLink() {
            list.forEach((item) => item.classList.remove('active'));
            this.classList.add('active');
        }
        list.forEach((item) => item.addEventListener('click', activeLink));

        // كود Firebase الأصلي الخاص بك
        const dbUrl = "https://sarab-app-84448-default-rtdb.firebaseio.com";

        async function updateUI() {
            try {
                const tRes = await fetch(`${dbUrl}/ticker.json`);
                const tData = await tRes.json();
                if(tData) {
                    document.getElementById('ticker-content').innerText = tData.text;
                    document.getElementById('ticker-link').href = tData.link || "#";
                }

                const aRes = await fetch(`${dbUrl}/active_ads.json`);
                const ads = await aRes.json();
                const container = document.getElementById('ads-container');
                container.innerHTML = "";
                
                let count = 0;
                if(ads) {
                    Object.keys(ads).forEach(key => {
                        const ad = ads[key];
                        count++;
                        container.innerHTML += `
                            <div class="ad-item">
                                <strong>📢 ${ad.title}</strong>
                                <div class="ad-meta">
                                    <span>👁️ ${ad.views || 0}</span>
                                    <span style="color: #f687b3;">ينتهي في: ${ad.end_at}</span>
                                </div>
                                <a href="${ad.post_url}" class="btn-ad" onclick="incAdView('${key}', ${ad.views || 0})">دخول السحب 🔓</a>
                            </div>`;
                    });
                }
                document.getElementById('active-ads-count').innerText = count;
                if(count === 0) container.innerHTML = "<p>لا توجد إعلانات نشطة</p>";

                const pRes = await fetch(`${dbUrl}/latest_posts.json`);
                const posts = await pRes.json();
                const pContainer = document.getElementById('posts-container');
                pContainer.innerHTML = "";
                if(posts) {
                    posts.reverse().slice(0, 10).forEach(post => {
                        pContainer.innerHTML += `
                            <div class="post-item">
                                <span>📄 ${post.text.substring(0, 30)}...</span>
                                <a href="${post.url}" class="btn-view">عرض</a>
                            </div>`;
                    });
                }
                document.getElementById('total-views').innerText = Math.floor(Math.random() * 100) + 104000;
            } catch(e) {}
        }

        async function incAdView(id, current) {
            await fetch(`${dbUrl}/active_ads/${id}/views.json`, { method: 'PUT', body: JSON.stringify(current + 1) });
        }

        setInterval(updateUI, 3000);
        updateUI();
    </script>
</body>
</html>
