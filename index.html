<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - اللعبة التفاعلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --primary: #5865f2;
            --gold: #f1c40f;
            --accent: #eb459e;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* شريط الرصيد العلوي */
        .top-bar {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border-bottom: 2px solid #2d333b;
        }

        .balance-box {
            background: #000;
            padding: 5px 15px;
            border-radius: 50px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stars-icon { color: var(--gold); font-size: 18px; }

        /* منطقة اللعبة الرئيسية */
        .game-container {
            width: 90%;
            max-width: 400px;
            margin-top: 30px;
            text-align: center;
        }

        /* دائرة الروليت */
        .roulette-box {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: 8px solid #21262d;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #1c2128;
        }

        canvas {
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1);
        }

        .timer-display {
            position: absolute;
            font-size: 40px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* لوحة التحكم */
        .bet-panel {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
        }

        .bet-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .bet-btn:disabled { opacity: 0.5; filter: grayscale(1); }
        .bet-btn:active { transform: scale(0.95); }

        /* قائمة المشتركين */
        .players-list {
            margin-top: 20px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .player-tag {
            background: #21262d;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid transparent;
        }

        .winner-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="top-bar">
        <div style="font-weight: 900; font-size: 18px; color: var(--primary);">روليت سراب</div>
        <div class="balance-box">
            <span class="stars-icon">⭐</span>
            <span id="user-balance">100,000</span>
        </div>
    </div>

    <div class="game-container">
        <div class="roulette-box">
            <div id="timer" class="timer-display">جاهز</div>
            <canvas id="wheelCanvas" width="280" height="280"></canvas>
        </div>

        <div class="bet-panel">
            <div class="input-group">
                <label style="display:block; margin-bottom: 8px; font-size: 13px; color: #8b949e;">حدد مبلغ الدخول</label>
                <input type="number" id="bet-amount" value="1000" min="100">
            </div>
            <button id="bet-btn" class="bet-btn" onclick="joinGame()">دخول السحب 🚀</button>
        </div>

        <div id="players-list" class="players-list">
            </div>
    </div>

    <div id="winner-overlay" class="winner-overlay">
        <h2 style="color: var(--gold); font-size: 30px;">🏆 الفائز بالجولة!</h2>
        <div id="winner-info" style="text-align: center; margin: 20px 0;"></div>
        <button class="bet-btn" style="width: 150px;" onclick="closeWinner()">حسناً</button>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('sarab_balance')) || 100000;
        let players = [];
        let isSpinning = false;
        let timeLeft = 10;
        let timerInterval = null;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const balanceDisplay = document.getElementById('user-balance');

        function updateBalanceUI() {
            balanceDisplay.innerText = balance.toLocaleString();
            localStorage.setItem('sarab_balance', balance);
        }

        updateBalanceUI();

        function drawWheel() {
            const totalBet = players.reduce((sum, p) => sum + p.amount, 0);
            let startAngle = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (players.length === 0) {
                ctx.fillStyle = "#1c2128";
                ctx.beginPath();
                ctx.arc(140, 140, 140, 0, Math.PI * 2);
                ctx.fill();
                return;
            }

            players.forEach(player => {
                const sliceAngle = (player.amount / totalBet) * 2 * Math.PI;
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.moveTo(140, 140);
                ctx.arc(140, 140, 140, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                ctx.fill();
                
                startAngle += sliceAngle;
            });
        }

        drawWheel();

        function joinGame() {
            const amount = parseInt(document.getElementById('bet-amount').value);

            if (amount > balance) return alert("رصيدك لا يكفي!");
            if (amount < 100) return alert("الحد الأدنى 100 نجمة");
            if (players.length >= 20) return alert("الغرفة ممتلئة!");

            balance -= amount;
            updateBalanceUI();

            const newPlayer = {
                id: Date.now(),
                name: players.length === 0 ? "أنت" : "لاعب " + (players.length + 1),
                amount: amount,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                img: 'https://files.catbox.moe/5s7y7a.png'
            };

            players.push(newPlayer);
            updatePlayersList();
            drawWheel();

            if (players.length === 1) startTimer();
        }

        function updatePlayersList() {
            const list = document.getElementById('players-list');
            list.innerHTML = players.map(p => `
                <div class="player-tag" style="border-color: ${p.color}">
                    <img src="${p.img}" width="18" style="border-radius:50%">
                    <span>${p.amount}</span>
                </div>
            `).join('');
        }

        function startTimer() {
            timeLeft = 10;
            document.getElementById('bet-btn').innerText = "دخول (انتظار لاعبين)";
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;

                // إضافة لاعبين وهميين للتجربة إذا كنت وحدك
                if (timeLeft === 7 && players.length === 1) simulatePlayer();
                if (timeLeft === 4 && players.length === 2) simulatePlayer();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (players.length >= 2) {
                        spinWheel();
                    } else {
                        alert("لا يوجد عدد كافٍ من اللاعبين، تم استرداد الرصيد.");
                        balance += players[0].amount;
                        resetGame();
                    }
                }
            }, 1000);
        }

        function simulatePlayer() {
            const amount = Math.floor(Math.random() * 5000) + 1000;
            players.push({
                id: Date.now() + Math.random(),
                name: "منافس " + players.length,
                amount: amount,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                img: 'https://via.placeholder.com/50'
            });
            updatePlayersList();
            drawWheel();
        }

        function spinWheel() {
            isSpinning = true;
            document.getElementById('bet-btn').disabled = true;
            document.getElementById('timer').innerText = "🌀";

            const randomRotation = 3600 + Math.random() * 3600; 
            canvas.style.transform = `rotate(${randomRotation}deg)`;

            setTimeout(() => {
                const winner = players[Math.floor(Math.random() * players.length)];
                showWinner(winner);
            }, 4000);
        }

        function showWinner(winner) {
            const totalPot = players.reduce((sum, p) => sum + p.amount, 0);
            
            const overlay = document.getElementById('winner-overlay');
            const info = document.getElementById('winner-info');
            
            info.innerHTML = `
                <img src="${winner.img}" width="80" style="border-radius:50%; border:4px solid ${winner.color}">
                <h3 style="margin:10px 0">${winner.name}</h3>
                <div style="font-size:24px; font-weight:900; color:var(--gold)">+${totalPot.toLocaleString()} ⭐</div>
            `;

            overlay.style.display = 'flex';
            confetti({ particleCount: 150, spread: 70 });

            if (winner.name === "أنت") {
                balance += totalPot;
                updateBalanceUI();
            }
        }

        function resetGame() {
            players = [];
            isSpinning = false;
            canvas.style.transform = `rotate(0deg)`;
            document.getElementById('timer').innerText = "جاهز";
            document.getElementById('bet-btn').disabled = false;
            document.getElementById('bet-btn').innerText = "دخول السحب 🚀";
            updatePlayersList();
            drawWheel();
            updateBalanceUI();
        }

        function closeWinner() {
            document.getElementById('winner-overlay').style.display = 'none';
            resetGame();
        }

        function simulatePlayer() {
            const amount = Math.floor(Math.random() * 5000) + 1000;
            players.push({
                id: Date.now() + Math.random(),
                name: "منافس " + players.length,
                amount: amount,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                img: 'https://files.catbox.moe/5s7y7a.png'
            });
            updatePlayersList();
            drawWheel();
        }
    </script>
</body>
</html>
