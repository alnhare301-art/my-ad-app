<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميدان الروليت المطور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --royal-black: #050505; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--royal-black); color: white; overflow: hidden; }
        .gold-btn { background: linear-gradient(135deg, #D4AF37, #A67C00); color: black; font-weight: 900; transition: 0.3s; }
        .gold-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #ball { transition: transform 0.05s linear; }
    </style>
</head>
<body>

    <div class="max-w-lg mx-auto p-4">
        <div class="flex justify-between items-center mb-6 bg-white/5 p-3 rounded-2xl border border-white/10">
            <div class="text-[var(--gold)] font-black text-xl italic">ARENA V2</div>
            <div class="bg-black/50 px-4 py-2 rounded-xl border border-[var(--gold)]/30">
                <span id="balanceDisplay" class="text-[var(--gold)] font-bold">0</span> ⭐
            </div>
        </div>

        <div id="statusCard" class="bg-gradient-to-r from-yellow-900/20 to-black p-4 rounded-2xl mb-4 border border-yellow-600/20">
            <div class="flex justify-between items-center">
                <div>
                    <div id="statusLabel" class="text-yellow-500 font-black text-lg">بانتظار الأبطال...</div>
                    <div id="statusTimer" class="text-xs text-gray-400">تحرك الكرة: وضع الاستعداد</div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-gray-500">المشاركون</div>
                    <div id="playerCount" class="text-2xl font-black text-white">0</div>
                </div>
            </div>
        </div>

        <div class="relative w-[300px] h-[300px] mx-auto rounded-3xl overflow-hidden border-4 border-white/10 bg-black shadow-[0_0_30px_rgba(0,0,0,0.5)]">
            <div id="ball" class="absolute w-5 h-5 bg-white rounded-full z-50 shadow-[0_0_15px_white]"></div>
            <div id="countdownOverlay" class="absolute inset-0 flex items-center justify-center bg-black/70 backdrop-blur-sm z-[60] hidden">
                <div id="bigTimer" class="text-8xl font-black text-[var(--gold)]"></div>
            </div>
            <canvas id="gameCanvas" width="600" height="600" class="w-full h-full"></canvas>
        </div>

        <div class="mt-6 space-y-4">
            <input type="number" id="betInput" value="1000" step="1000" class="w-full bg-white/5 border-2 border-white/10 p-4 rounded-2xl text-center text-2xl font-black text-[var(--gold)] focus:border-[var(--gold)] outline-none">
            <button id="joinBtn" class="gold-btn w-full py-5 rounded-2xl text-xl shadow-lg shadow-yellow-900/20">دخول الميدان الآن ⚔️</button>
        </div>

        <div id="playersList" class="mt-6 space-y-2 overflow-y-auto max-h-[150px]"></div>
    </div>

    <div id="winnerOverlay" class="fixed inset-0 bg-black/98 z-[1000] hidden flex-col items-center justify-center text-center p-6">
        <div id="winnerColorBox" class="w-32 h-32 rounded-full border-8 border-[var(--gold)] mb-6 animate-bounce"></div>
        <div class="text-[var(--gold)] text-xl font-bold mb-2">الفائز في هذه الجولة</div>
        <div id="winnerName" class="text-4xl font-black text-white mb-4"></div>
        <div id="winnerPrize" class="text-6xl font-black text-yellow-500"></div>
    </div>

    <script>
        const DB_URL = "https://sarab-app-84448-default-rtdb.firebaseio.com/global_v6";
        const myId = localStorage.getItem("tg_id") || "U" + Math.floor(Math.random()*9999);
        localStorage.setItem("tg_id", myId);

        // إعداد الرصيد الابتدائي (100 ألف)
        if(!localStorage.getItem("init_v6")) {
            localStorage.setItem("bal", 100000);
            localStorage.setItem("init_v6", true);
        }

        let myBal = parseInt(localStorage.getItem("bal"));
        let players = [];
        let gameState = "waiting";
        let isMoving = false;
        
        // متغيرات الكرة (فيزياء الكيرم)
        let bx = 150, by = 150, bvx = 3, bvy = 3;
        const ballElem = document.getElementById("ball");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function updateBalDisp() {
            document.getElementById("balanceDisplay").innerText = myBal.toLocaleString();
            localStorage.setItem("bal", myBal);
        }
        updateBalDisp();

        // 1. تصفير البيانات عند البداية إذا لم يوجد لاعبون (لحل مشكلة اللاعبين الوهميين)
        async function checkAndReset() {
            const res = await fetch(`${DB_URL}.json`);
            const data = await res.json();
            if (!data || !data.players) {
                await fetch(`${DB_URL}.json`, { method: 'PUT', body: JSON.stringify({ state: "waiting", players: {} }) });
            }
        }
        checkAndReset();

        // 2. محرك حركة الكرة (فيزياء متطورة)
        function moveBall() {
            bx += bvx;
            by += bvy;

            // اصطدام بالجدران مع إضافة "تغيير طفيف في الزاوية" لمنع الحركة الخطية المملة
            if (bx <= 0 || bx >= 280) {
                bvx *= -1.02; // تسريع طفيف
                bvy += (Math.random() - 0.5) * 2; // تغيير زاوية عشوائي (مثل الكيرم)
                bx = bx <= 0 ? 1 : 279;
            }
            if (by <= 0 || by >= 280) {
                bvy *= -1.02;
                bvx += (Math.random() - 0.5) * 2;
                by = by <= 0 ? 1 : 279;
            }

            // تحديد سرعة قصوى ودنيا لضمان المتعة
            const speed = Math.sqrt(bvx*bvx + bvy*bvy);
            if(speed > 12) { bvx *= 0.9; bvy *= 0.9; }
            if(speed < 3 && gameState === "waiting") { bvx *= 1.1; bvy *= 1.1; }

            ballElem.style.transform = `translate(${bx}px, ${by}px)`;
            
            if (gameState !== "playing" || speed > 0.1) {
                requestAnimationFrame(moveBall);
            }
        }
        moveBall(); // تشغيل الحركة فوراً

        async function sync() {
            try {
                const res = await fetch(`${DB_URL}.json`);
                const data = await res.json();
                if (!data) return;

                players = data.players ? Object.values(data.players) : [];
                gameState = data.state || "waiting";
                
                document.getElementById("playerCount").innerText = players.length;
                drawArena();
                updateUI(data);

                // منطق العد التنازلي
                if (players.length >= 2 && gameState === "waiting") {
                    if (myId === players[0].id) { // أول لاعب هو الميقاتي
                        await fetch(`${DB_URL}.json`, { method: 'PATCH', body: JSON.stringify({ state: "counting", startAt: Date.now() }) });
                    }
                }

                if (gameState === "counting") {
                    const diff = Math.floor((Date.now() - data.startAt) / 1000);
                    const timer = 10 - diff;
                    if (timer <= 0) {
                        if (myId === players[0].id) {
                            await fetch(`${DB_URL}.json`, { method: 'PATCH', body: JSON.stringify({ state: "playing", seed: Math.random() }) });
                        }
                    } else {
                        document.getElementById("bigTimer").innerText = timer;
                        document.getElementById("countdownOverlay").classList.remove("hidden");
                    }
                } else {
                    document.getElementById("countdownOverlay").classList.add("hidden");
                }

                // نهاية اللعبة وتحديد الفائز
                if (gameState === "playing" && !isMoving) {
                    startFinalSpin(data.seed);
                }

            } catch (e) { console.log(e); }
        }

        function drawArena() {
            ctx.clearRect(0, 0, 600, 600);
            const total = players.reduce((s, p) => s + p.amount, 0);
            if (total === 0) { ctx.fillStyle = "#111"; ctx.fillRect(0,0,600,600); return; }

            let x=0, y=0, w=600, h=600;
            players.forEach((p, i) => {
                const pPercent = p.amount / total;
                ctx.fillStyle = p.color;
                if(i % 2 === 0) {
                    let pw = (i === players.length - 1) ? w : w * pPercent;
                    ctx.fillRect(x, y, pw, h);
                    p.area = {x1: x, y1: y, x2: x+pw, y2: y+h};
                    x += pw; w -= pw;
                } else {
                    let ph = (i === players.length - 1) ? h : h * pPercent;
                    ctx.fillRect(x, y, w, ph);
                    p.area = {x1: x, y1: y, x2: x+w, y2: y+ph};
                    y += ph; h -= ph;
                }
            });
        }

        function updateUI(data) {
            const list = document.getElementById("playersList");
            list.innerHTML = players.map(p => `
                <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border-r-8" style="border-color: ${p.color}">
                    <span class="font-bold">${p.name} ${p.id === myId ? '(أنت)' : ''}</span>
                    <span class="text-yellow-500 font-black">${p.amount.toLocaleString()}</span>
                </div>
            `).join('');

            const btn = document.getElementById("joinBtn");
            btn.disabled = (gameState !== "waiting" && gameState !== "counting");
        }

        function startFinalSpin(seed) {
            isMoving = true;
            // قوة الدفعة الأخيرة بناءً على الـ seed لضمان نفس النتيجة عند الكل
            bvx = Math.cos(seed * 7) * 20;
            bvy = Math.sin(seed * 7) * 20;

            const friction = 0.98;
            function animate() {
                bvx *= friction;
                bvy *= friction;
                if (Math.abs(bvx) < 0.1 && Math.abs(bvy) < 0.1) {
                    isMoving = false;
                    checkWinner();
                    return;
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        function checkWinner() {
            // تحويل إحداثيات الكرة الصغير (300x300) إلى إحداثيات الكانفاس (600x600)
            const finalX = (bx + 10) * 2;
            const finalY = (by + 10) * 2;

            const winner = players.find(p => 
                finalX >= p.area.x1 && finalX <= p.area.x2 &&
                finalY >= p.area.y1 && finalY <= p.area.y2
            );

            if (winner) {
                const totalPrize = players.reduce((s, p) => s + p.amount, 0);
                showWinner(winner, totalPrize);
            }
        }

        function showWinner(w, prize) {
            const overlay = document.getElementById("winnerOverlay");
            document.getElementById("winnerName").innerText = w.name;
            document.getElementById("winnerPrize").innerText = "+" + prize.toLocaleString();
            document.getElementById("winnerColorBox").style.backgroundColor = w.color;
            overlay.classList.remove("hidden");
            overlay.classList.add("flex");

            if(w.id === myId) {
                myBal += prize;
                updateBalDisp();
            }

            setTimeout(async () => {
                overlay.classList.add("hidden");
                if (myId === players[0].id) {
                    await fetch(`${DB_URL}.json`, { method: 'PUT', body: JSON.stringify({ state: "waiting", players: {} }) });
                }
            }, 5000);
        }

        document.getElementById("joinBtn").onclick = async () => {
            const amt = parseInt(document.getElementById("betInput").value);
            if (amt > myBal) return alert("رصيدك غير كافٍ!");
            if (amt < 100) return alert("الحد الأدنى 100!");

            myBal -= amt;
            updateBalDisp();

            const pData = {
                id: myId,
                name: "لاعب_" + myId.substr(1, 3),
                amount: amt,
                color: `hsl(${Math.random()*360}, 70%, 50%)`
            };

            await fetch(`${DB_URL}/players/${myId}.json`, { method: 'PUT', body: JSON.stringify(pData) });
        };

        setInterval(sync, 1000);
    </script>
</body>
</html>
