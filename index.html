<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت - ساحة الميدان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F7E7CE;
            --royal-black: #050505;
            --bronze: #CD7F32;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--royal-black);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }
        .gold-glow {
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
        }
        .gold-btn {
            background: linear-gradient(135deg, #D4AF37, #A67C00);
            color: black;
            font-weight: 900;
            transition: all 0.3s ease;
        }
        .gold-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        .confetti-piece {
            position: fixed;
            top: -10px;
            z-index: 3000;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen pb-8">
        <header class="sticky top-0 z-50 bg-[#050505eb] backdrop-blur-md border-b border-[rgba(212,175,55,0.15)]">
            <div class="flex items-center justify-between px-4 py-3 max-w-lg mx-auto">
                <div class="flex items-center gap-2 text-[var(--gold)]">
                    <span class="font-extrabold text-xl">روليت</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="resetBal" class="text-xs px-2.5 py-1.5 rounded-lg bg-[rgba(212,175,55,0.1)] border border-[rgba(212,175,55,0.2)] text-[var(--gold)]">إعادة</button>
                    <div class="flex items-center gap-2 font-extrabold px-3 py-1.5 rounded-xl bg-[rgba(212,175,55,0.08)] border border-[rgba(212,175,55,0.15)] text-[var(--gold)]">
                        <span id="balanceDisplay">0</span> ⭐
                    </div>
                </div>
            </div>
        </header>

        <div class="px-4 max-w-lg mx-auto">
            <div class="text-center mt-8 mb-6">
                <h1 class="text-3xl font-black mb-2 bg-gradient-to-r from-[var(--gold-light)] via-[var(--gold)] to-[var(--bronze)] bg-clip-text text-transparent">ساحة الميدان</h1>
                <p class="text-sm text-[rgba(212,175,55,0.5)]">تحدَّ الجميع وسيطر على الأرض</p>
            </div>

            <div id="statusCard" class="rounded-2xl p-4 mb-5 border border-[rgba(212,175,55,0.15)] bg-gradient-to-br from-[rgba(212,175,55,0.08)] to-[rgba(212,175,55,0.03)]">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div id="statusEmoji" class="w-10 h-10 rounded-xl flex items-center justify-center bg-green-500/20 border border-green-500/40 text-lg">🟢</div>
                        <div>
                            <span id="statusLabel" class="text-sm font-black block text-green-500">بانتظار اللاعبين</span>
                            <span id="statusTimer" class="text-xs text-[rgba(212,175,55,0.4)]"></span>
                        </div>
                    </div>
                    <div class="px-3 py-1.5 rounded-xl bg-[rgba(212,175,55,0.06)] border border-[rgba(212,175,55,0.1)] text-[var(--gold)] font-bold text-sm">
                        لاعبين: <span id="playerCount">0</span>
                    </div>
                </div>
            </div>

            <div class="relative mx-auto mb-6 w-[320px] h-[320px] rounded-[20px] overflow-hidden border-[3px] border-[rgba(212,175,55,0.25)] bg-black shadow-2xl">
                <div id="ball" class="absolute w-5 h-5 bg-white rounded-full z-[100] hidden shadow-[0_0_15px_#fff]"></div>
                <div id="countdownOverlay" class="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-[110] hidden">
                    <span id="bigTimer" class="text-8xl font-black text-[var(--gold)]"></span>
                </div>
                <canvas id="gameCanvas" width="600" height="600" class="w-full h-full"></canvas>
            </div>

            <div id="betSection" class="rounded-2xl p-5 border border-[rgba(212,175,55,0.15)] bg-[rgba(212,175,55,0.04)] mb-6">
                <label class="block text-sm font-black mb-3 text-[var(--gold)]">💰 مبلغ الرهان</label>
                <input type="number" id="betInput" value="1000" class="w-full text-center text-2xl font-black mb-4 p-4 rounded-2xl bg-black border-2 border-[rgba(212,175,55,0.2)] text-[var(--gold)] outline-none">
                <div class="flex gap-2 mb-4">
                    <button onclick="setBet(1000)" class="flex-1 py-2 rounded-xl bg-[rgba(212,175,55,0.05)] border border-[rgba(212,175,55,0.1)] text-[var(--gold)] text-xs font-bold">1K</button>
                    <button onclick="setBet(5000)" class="flex-1 py-2 rounded-xl bg-[rgba(212,175,55,0.05)] border border-[rgba(212,175,55,0.1)] text-[var(--gold)] text-xs font-bold">5K</button>
                    <button onclick="setBet(10000)" class="flex-1 py-2 rounded-xl bg-[rgba(212,175,55,0.05)] border border-[rgba(212,175,55,0.1)] text-[var(--gold)] text-xs font-bold">10K</button>
                </div>
                <button id="joinBtn" class="gold-btn w-full py-4 rounded-2xl text-lg">دخول الميدان ⚔️</button>
            </div>

            <div id="playersList" class="space-y-2 mb-6"></div>
        </div>
    </div>

    <div id="winnerOverlay" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[2000] hidden flex flex-col items-center justify-center text-center">
        <div id="winnerColorBox" class="w-24 h-24 rounded-3xl border-4 border-[var(--gold)] mb-6 shadow-[0_0_50px_rgba(212,175,55,0.3)]"></div>
        <p class="text-[rgba(212,175,55,0.6)] font-bold">🏆 الفائز</p>
        <h2 id="winnerName" class="text-3xl font-black text-white mb-2"></h2>
        <h1 id="winnerPrize" class="text-5xl font-black text-[var(--gold)] mb-8"></h1>
        <div class="p-4 rounded-2xl bg-[rgba(212,175,55,0.1)] border border-[rgba(212,175,55,0.2)] text-[var(--gold)] font-bold">
            يفتح الميدان مجدداً خلال ثوانٍ...
        </div>
    </div>

    <script>
        const DB_PATH = "https://sarab-app-84448-default-rtdb.firebaseio.com/global_v6";
        const BASE_BALANCE = 100000;
        let myId = localStorage.getItem("tg_user_id") || "P" + Math.floor(Math.random() * 9999);
        localStorage.setItem("tg_user_id", myId);

        let myBal = parseInt(localStorage.getItem("user_bal")) || BASE_BALANCE;
        let gameState = "waiting";
        let players = [];
        let runningPhysics = false;

        // Elements
        const balDisp = document.getElementById("balanceDisplay");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const ball = document.getElementById("ball");

        function updateBalance(amt) {
            myBal = amt;
            localStorage.setItem("user_bal", amt);
            balDisp.innerText = amt.toLocaleString();
        }
        updateBalance(myBal);

        function setBet(val) { document.getElementById("betInput").value = val; }

        async function sync() {
            try {
                const res = await fetch(`${DB_PATH}.json`);
                const data = await res.json();
                if (!data) return;

                players = data.players ? Object.values(data.players) : [];
                gameState = data.state || "waiting";
                
                document.getElementById("playerCount").innerText = players.length;
                drawMap();
                updateUI(data);

                if (gameState === "playing" && !runningPhysics) {
                    runPhysics(data.seed || 0.5);
                }
                
                if (gameState === "finished" && data.winner && !document.getElementById("winnerOverlay").classList.contains("flex")) {
                    showWinner(data);
                }
            } catch (e) { console.error(e); }
        }

        function drawMap() {
            ctx.clearRect(0, 0, 600, 600);
            const total = players.reduce((s, p) => s + p.amount, 0);
            if (total === 0) return;

            let curX = 0, curY = 0, w = 600, h = 600;
            players.forEach((p, i) => {
                const ratio = p.amount / total;
                ctx.fillStyle = p.color;
                if (i % 2 === 0) {
                    let sW = (i === players.length - 1) ? w : w * ratio;
                    ctx.fillRect(curX, curY, sW, h);
                    p.coords = { x1: curX, y1: curY, x2: curX + sW, y2: curY + h };
                    curX += sW; w -= sW;
                } else {
                    let sH = (i === players.length - 1) ? h : h * ratio;
                    ctx.fillRect(curX, curY, w, sH);
                    p.coords = { x1: curX, y1: curY, x2: curX + w, y2: curY + sH };
                    curY += sH; h -= sH;
                }
            });
        }

        function updateUI(data) {
            const list = document.getElementById("playersList");
            list.innerHTML = "";
            players.forEach(p => {
                list.innerHTML += `
                    <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border-r-4" style="border-color: ${p.color}">
                        <span class="font-bold">${p.name} ${p.id === myId ? '(أنت)' : ''}</span>
                        <span class="text-[var(--gold)] font-black">${p.amount.toLocaleString()} ⭐</span>
                    </div>
                `;
            });

            const overlay = document.getElementById("countdownOverlay");
            const bigTimer = document.getElementById("bigTimer");
            if (gameState === "counting") {
                overlay.classList.remove("hidden");
                bigTimer.innerText = data.timer;
            } else {
                overlay.classList.add("hidden");
            }
        }

        function runPhysics(seed) {
            runningPhysics = true;
            ball.style.display = "block";
            let px = 150, py = 150, vx = seed * 40 + 10, vy = (1 - seed) * 40 + 10;
            
            function frame() {
                px += vx; py += vy;
                if (px <= 0 || px >= 300) vx *= -1;
                if (py <= 0 || py >= 300) vy *= -1;
                vx *= 0.985; vy *= 0.985;
                ball.style.left = px + "px";
                ball.style.top = py + "px";

                if (Math.abs(vx) > 0.2) requestAnimationFrame(frame);
                else {
                    runningPhysics = false;
                    // Winner logic is handled by the first player or backend in a real scenario
                }
            }
            frame();
        }

        function showWinner(data) {
            const over = document.getElementById("winnerOverlay");
            document.getElementById("winnerName").innerText = data.winnerName;
            document.getElementById("winnerPrize").innerText = "+" + data.prize?.toLocaleString() + " ⭐";
            document.getElementById("winnerColorBox").style.backgroundColor = data.winnerColor;
            over.classList.remove("hidden");
            over.classList.add("flex");
            
            if (data.winner === myId) {
                // Confetti
                for(let i=0; i<50; i++) {
                    const c = document.createElement("div");
                    c.className = "confetti-piece";
                    c.style.left = Math.random()*100+"vw";
                    c.style.width = "10px"; c.style.height = "10px";
                    c.style.backgroundColor = ["#D4AF37", "#fff", "#CD7F32"][Math.floor(Math.random()*3)];
                    c.style.animationDuration = (Math.random()*2+2)+"s";
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }
                updateBalance(myBal + data.prize);
            }
            
            setTimeout(() => {
                over.classList.add("hidden");
                over.classList.remove("flex");
                ball.style.display = "none";
            }, 5000);
        }

        document.getElementById("joinBtn").onclick = async () => {
            const amt = parseInt(document.getElementById("betInput").value);
            if (amt > myBal) return alert("الرصيد غير كافٍ");
            
            updateBalance(myBal - amt);
            const pData = {
                id: myId,
                name: "لاعب " + myId.substr(1),
                amount: amt,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`
            };
            
            await fetch(`${DB_PATH}/players/${myId}.json`, { method: "PUT", body: JSON.stringify(pData) });
            await fetch(`${DB_PATH}.json`, { method: "PATCH", body: JSON.stringify({ state: "waiting" }) });
        };

        document.getElementById("resetBal").onclick = () => updateBalance(BASE_BALANCE);

        setInterval(sync, 1000);
    </script>
</body>
</html>
