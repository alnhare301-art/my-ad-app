<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - نظام المنافسة الحقيقية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --gold: #f1c40f;
            --cyan: #00f2ff;
            --pink: #ff007a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%; padding: 15px; background: #161b22;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #30363d;
        }

        .balance {
            background: #000; padding: 5px 15px; border-radius: 50px;
            border: 1px solid var(--gold); color: var(--gold); font-weight: 900;
        }

        /* ساحة اللعبة */
        .game-board {
            position: relative;
            width: 320px; height: 320px;
            margin: 40px auto;
            background: #1c2128;
            border: 5px solid #30363d;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #ball {
            position: absolute;
            width: 22px; height: 22px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff, inset 0 0 5px rgba(0,0,0,0.5);
            z-index: 10;
            display: none;
            pointer-events: none;
            border: 2px solid var(--cyan);
        }

        canvas { display: block; }

        .controls {
            width: 90%; max-width: 400px;
            background: #161b22; padding: 25px;
            border-radius: 25px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .status-msg {
            font-size: 18px; font-weight: 800; color: var(--cyan);
            margin-bottom: 15px; min-height: 27px;
        }

        input {
            width: 100%; padding: 15px; border-radius: 15px;
            border: 1px solid #30363d; background: #0d1117;
            color: white; font-size: 20px; font-weight: 700;
            margin-bottom: 15px; text-align: center;
        }

        .btn-play {
            width: 100%; padding: 18px; border-radius: 15px; border: none;
            background: linear-gradient(45deg, var(--cyan), var(--pink));
            color: white; font-weight: 900; font-size: 18px; cursor: pointer;
            transition: 0.3s;
        }

        .btn-play:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-play:active { transform: scale(0.96); }

        /* قائمة اللاعبين الصغار */
        .players-avatars {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 10px; margin-top: 20px;
        }

        .avatar {
            width: 35px; height: 35px; border-radius: 50%;
            border: 2px solid var(--glass); object-fit: cover;
        }

        /* نافذة الفائز */
        #winner-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900; letter-spacing: 1px;">SARAB ROULETTE</div>
        <div class="balance">⭐ <span id="balance">100,000</span></div>
    </div>

    <div id="board" class="game-board">
        <div id="ball"></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls">
        <div id="status-text" class="status-msg">في انتظار أول لاعب...</div>
        <input type="number" id="bet-input" value="1000" min="100" step="100">
        <button id="join-btn" class="btn-play" onclick="joinGame()">دخول الجولة 🚀</button>
        
        <div class="players-avatars" id="avatars-list"></div>
    </div>

    <div id="winner-overlay">
        <div id="winner-card" style="padding: 40px;">
            <h1 style="color:var(--gold); font-size: 35px;">🏆 الفائز!</h1>
            <div id="winner-content"></div>
            <button class="btn-play" style="width: 200px; margin-top:30px;" onclick="closeWinner()">جولة جديدة</button>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('sarab_v3_bal')) || 100000;
        let players = [];
        let timer = 10;
        let countdownActive = false;
        let timerInterval;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ballEl = document.getElementById('ball');
        const boardEl = document.getElementById('board');

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            localStorage.setItem('sarab_v3_bal', balance);
            
            const avatarsList = document.getElementById('avatars-list');
            avatarsList.innerHTML = players.map(p => 
                `<img src="https://files.catbox.moe/5s7y7a.png" class="avatar" style="border-color: ${p.color}" title="${p.amount}">`
            ).join('');
        }

        function drawBoard() {
            const totalBet = players.reduce((s, p) => s + p.amount, 0);
            ctx.clearRect(0, 0, 320, 320);

            if (players.length === 0) {
                ctx.fillStyle = "#1c2128";
                ctx.fillRect(0, 0, 320, 320);
                return;
            }

            let currentX = 0;
            players.forEach(p => {
                const pWidth = (p.amount / totalBet) * 320;
                ctx.fillStyle = p.color;
                ctx.fillRect(currentX, 0, pWidth, 320);
                currentX += pWidth;
            });
        }

        updateUI();
        drawBoard();

        function joinGame() {
            const betAmt = parseInt(document.getElementById('bet-input').value);
            if (betAmt > balance) return alert("رصيدك لا يكفي!");
            if (betAmt < 100) return alert("الحد الأدنى 100 نجمة");

            balance -= betAmt;
            players.push({
                id: Date.now(),
                name: players.length === 0 ? "أنت" : `لاعب ${players.length + 1}`,
                amount: betAmt,
                color: `hsl(${Math.random() * 360}, 75%, 55%)`
            });

            document.getElementById('join-btn').disabled = true;
            updateUI();
            drawBoard();

            checkStartCondition();
        }

        function checkStartCondition() {
            const statusText = document.getElementById('status-text');
            
            if (players.length === 1) {
                statusText.innerText = "في انتظار خصم (1/2)...";
                // للتجربة: لو ضغطت مرة ثانية (بعد تحديث الكود لغرض الاختبار) 
                // أو فتحت تبويب آخر، سيبدأ العداد.
            } 
            else if (players.length >= 2 && !countdownActive) {
                startTimer();
            }
        }

        function startTimer() {
            countdownActive = true;
            timer = 10;
            const statusText = document.getElementById('status-text');

            timerInterval = setInterval(() => {
                timer--;
                statusText.innerText = `يبدأ السحب خلال: ${timer} ثوانٍ`;

                if (timer <= 0) {
                    clearInterval(timerInterval);
                    runPhysics();
                }
            }, 1000);
        }

        function runPhysics() {
            document.getElementById('status-text').innerText = "جاري تحديد الفائز...";
            ballEl.style.display = 'block';
            
            let x = 150, y = 150;
            let vx = (Math.random() * 10 + 15) * (Math.random() > 0.5 ? 1 : -1);
            let vy = (Math.random() * 10 + 15) * (Math.random() > 0.5 ? 1 : -1);
            let friction = 0.988;

            function animate() {
                x += vx; y += vy;

                if (x <= 0 || x >= 298) vx *= -1;
                if (y <= 0 || y >= 298) vy *= -1;

                vx *= friction;
                vy *= friction;

                ballEl.style.left = x + 'px';
                ballEl.style.top = y + 'px';

                // زوم عند التباطؤ
                if (Math.abs(vx) < 6) boardEl.style.transform = "scale(1.2)";

                if (Math.abs(vx) > 0.15) {
                    requestAnimationFrame(animate);
                } else {
                    finishGame(x);
                }
            }
            animate();
        }

        function finishGame(finalX) {
            const totalPot = players.reduce((s, p) => s + p.amount, 0);
            let currentX = 0;
            let winner = players[0];

            players.forEach(p => {
                const pWidth = (p.amount / totalPot) * 320;
                if (finalX >= currentX && finalX <= currentX + pWidth) {
                    winner = p;
                }
                currentX += pWidth;
            });

            const overlay = document.getElementById('winner-overlay');
            const content = document.getElementById('winner-content');
            
            content.innerHTML = `
                <div style="width:100px; height:100px; background:${winner.color}; border-radius:50%; margin:20px auto; border:5px solid #fff; box-shadow:0 0 20px ${winner.color}">
                    <img src="https://files.catbox.moe/5s7y7a.png" style="width:100%; border-radius:50%">
                </div>
                <h2 style="margin:0">${winner.name}</h2>
                <h1 style="color:var(--gold); font-size:40px; margin:10px 0">+${totalPot.toLocaleString()} ⭐</h1>
            `;

            overlay.style.display = 'flex';
            confetti({ particleCount: 250, spread: 100, origin: { y: 0.7 } });

            if (winner.name === "أنت") {
                balance += totalPot;
                updateUI();
            }
        }

        function closeWinner() {
            document.getElementById('winner-overlay').style.display = 'none';
            resetGame();
        }

        function resetGame() {
            players = [];
            countdownActive = false;
            boardEl.style.transform = "scale(1)";
            ballEl.style.display = 'none';
            document.getElementById('join-btn').disabled = false;
            document.getElementById('status-text').innerText = "في انتظار أول لاعب...";
            drawBoard();
            updateUI();
        }
    </script>
</body>
</html>
