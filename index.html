<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - التميز الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* تعريف المتغيرات والألوان الملكية */
        :root {
            --gold: #D4AF37;
            --gold-light: #f1d592;
            --bg-dark: #05070a;
            --card-bg: rgba(18, 22, 31, 0.85);
            --glass-border: rgba(212, 175, 55, 0.2);
            --text-gray: #94a3b8;
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #1a1608, #05070a);
            color: #f1f5f9;
            margin: 0;
            padding-bottom: 120px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* الخلفية المنقوشة */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.15;
            z-index: -1;
        }

        /* الهيدر الفاخر */
        .header-ticker {
            position: fixed;
            top: 0; width: 100%; height: 65px;
            background: rgba(5, 7, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            z-index: 1000;
            padding: 0 15px;
        }

        .ticker-container {
            flex: 1;
            overflow: hidden;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 50px;
            padding: 6px 20px;
            margin-left: 10px;
            border: 1px solid var(--glass-border);
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            font-weight: 600;
            font-size: 13px;
            animation: scroll 18s linear infinite;
            color: var(--gold-light);
        }

        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* الحاوية الرئيسية */
        .main-content {
            padding: 100px 20px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .logo { 
            width: 110px; height: 110px; 
            border-radius: 50%; 
            border: 3px solid var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            background: #000;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 0;
        }

        /* صناديق الإحصائيات */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            text-align: center;
            transition: 0.3s;
        }

        .stat-box h3 { margin: 0; font-size: 28px; color: #fff; }
        .stat-box p { margin: 5px 0 0; font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: 1px; }

        /* تصميم البطاقات المطور */
        .ad-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid var(--glass-border);
            position: relative;
            transition: transform 0.3s ease;
        }

        .ad-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .ad-title { 
            font-size: 18px; 
            font-weight: 800; 
            color: #fff; 
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ad-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-gray);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }

        /* --- تأثير الإطار الذهبي المتحرك للأزرار --- */
        .gold-border-animation {
            position: relative;
            padding: 2px;
            border-radius: 18px;
            overflow: hidden;
            display: block;
            margin-top: 20px;
        }

        .gold-border-animation::before {
            content: '';
            position: absolute;
            inset: -200%;
            background: conic-gradient(from var(--angle), transparent 70%, var(--gold), #fff, var(--gold));
            animation: rotateGold 4s linear infinite;
        }

        @keyframes rotateGold {
            from { --angle: 0deg; }
            to { --angle: 360deg; }
        }

        .join-btn {
            position: relative;
            background: #0a0c10;
            color: var(--gold);
            padding: 14px;
            border-radius: 16px;
            display: block;
            text-align: center;
            font-weight: 800;
            font-size: 15px;
            text-decoration: none;
            z-index: 1;
            transition: 0.3s;
            border: none;
        }

        .join-btn:hover {
            background: var(--gold);
            color: #000;
        }

        /* شريط التنقل السفلي */
        .nav-wrapper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            height: 75px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 2000;
        }

        .nav-link { 
            text-decoration: none; 
            color: #1e293b; 
            text-align: center; 
            font-size: 11px; 
            font-weight: 800;
            transition: 0.3s;
        }

        .nav-icon { font-size: 1.6em; display: block; margin-bottom: 2px; }
        
        .nav-item.active .nav-link {
            color: var(--gold);
            transform: translateY(-5px);
        }

    </style>
</head>
<body>

    <header class="header-ticker">
        <div class="ticker-container">
            <div class="ticker-text" id="ticker-content">مرحباً بك في روليت سراب.. السحب القادم سيبدأ خلال دقائق.. حظاً موفقاً لجميع المشتركين!</div>
        </div>
        <a href="#" class="join-btn" style="padding: 8px 15px; font-size: 11px; margin: 0;">الملف الشخصي</a>
    </header>

    <div class="main-content">
        <div class="hero-section">
            <div class="logo-wrapper">
                <img src="https://files.catbox.moe/5s7y7a.png" class="logo" alt="سراب">
            </div>
            <h1 class="brand-name">روليت سراب</h1>
            <p style="color: var(--gold); font-size: 13px; font-weight: 600; letter-spacing: 2px;">LUXURY EXPERIENCE</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <h3 id="total-views">128K</h3>
                <p>إجمالي الزيارات</p>
            </div>
            <div class="stat-box">
                <h3 id="active-ads-count">0</h3>
                <p>السحوبات النشطة</p>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 20px; margin: 0; color: #fff;">🏆 السحوبات الفاخرة</h2>
            <span style="color: #4ade80; font-size: 12px;">● متصل الآن</span>
        </div>

        <div id="ads-container">
            </div>
    </div>

    <nav class="nav-wrapper">
        <div class="nav-item active">
            <a href="#" class="nav-link"><ion-icon name="home" class="nav-icon"></ion-icon>الرئيسية</a>
        </div>
        <div class="nav-item">
            <a href="#" class="nav-link"><ion-icon name="trophy-outline" class="nav-icon"></ion-icon>الفائزين</a>
        </div>
        <div class="nav-item">
            <a href="#" class="nav-link"><ion-icon name="headset-outline" class="nav-icon"></ion-icon>الدعم</a>
        </div>
        <div class="nav-item">
            <a href="#" class="nav-link"><ion-icon name="grid-outline" class="nav-icon"></ion-icon>المزيد</a>
        </div>
    </nav>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script>
        const dbUrl = "https://sarab-app-84448-default-rtdb.firebaseio.com";

        async function updateData() {
            try {
                const aRes = await fetch(`${dbUrl}/active_ads.json`);
                const ads = await aRes.json();
                const container = document.getElementById('ads-container');
                container.innerHTML = "";
                
                let count = 0;
                if(ads) {
                    Object.keys(ads).forEach(key => {
                        const ad = ads[key];
                        count++;
                        container.innerHTML += `
                            <div class="ad-card">
                                <span class="ad-title">💎 ${ad.title}</span>
                                <div class="ad-footer">
                                    <span>مشاهدات: ${ad.views || 0}</span>
                                    <span style="color:var(--gold)">ينتهي: ${ad.end_at}</span>
                                </div>
                                <div class="gold-border-animation">
                                    <a href="${ad.post_url}" class="join-btn" onclick="incView('${key}', ${ad.views || 0})">
                                        دخول السحب الملكي 🔓
                                    </a>
                                </div>
                            </div>`;
                    });
                }
                document.getElementById('active-ads-count').innerText = count;
                if(count === 0) container.innerHTML = "<p style='text-align:center; color:#64748b; padding: 20px;'>لا توجد سحوبات نشطة حالياً، انتظرنا قريباً!</p>";
            } catch(e) { console.log("خطأ في تحديث البيانات"); }
        }

        async function incView(id, current) {
            fetch(`${dbUrl}/active_ads/${id}/views.json`, { method: 'PUT', body: JSON.stringify(current + 1) });
        }

        setInterval(updateData, 5000);
        updateData();
    </script>
</body>
</html>
