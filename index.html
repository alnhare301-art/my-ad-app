<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تناهيد - التجربة الفخمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #818cf8;
            --secondary: #c084fc;
            --accent: #fb7185;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold: #D4AF37;
            --cyan: #00f2ff;
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f1f5f9;
            margin: 0;
            padding-bottom: 120px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* الشريط العلوي */
        .header-ticker {
            position: fixed;
            top: 0; width: 100%; height: 60px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            z-index: 1000;
            padding: 0 15px;
        }

        .ticker-container {
            flex: 1;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            border-radius: 50px;
            padding: 5px 20px;
            margin-left: 10px;
            border: 1px solid var(--glass-border);
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            font-weight: 600;
            font-size: 14px;
            animation: scroll 15s linear infinite;
            color: var(--primary);
        }

        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* --- تأثير الزر المتحرك (المطلوب) --- */
        .animated-btn-wrapper {
            position: relative;
            padding: 3px; /* سمك الإطار */
            border-radius: 18px;
            overflow: hidden;
            display: block;
            margin-top: 15px;
            text-decoration: none;
        }

        .animated-btn-wrapper::before {
            content: '';
            position: absolute;
            inset: -20%;
            background: conic-gradient(from var(--angle), transparent 70%, var(--cyan), var(--accent), var(--cyan));
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { --angle: 0deg; }
            to { --angle: 360deg; }
        }

        .join-btn {
            position: relative;
            background: #1e293b; /* لون خلفية الزر من الداخل */
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            display: block;
            text-align: center;
            font-weight: 800;
            z-index: 1;
            transition: 0.3s;
            text-decoration: none;
            border: none;
            font-size: 14px;
        }

        .join-btn:hover {
            background: transparent;
            text-shadow: 0 0 10px var(--cyan);
        }
        /* -------------------------------- */

        .main-content {
            padding: 90px 20px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo { width: 100px; height: 100px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 20px var(--primary); }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .stat-box {
            background: var(--glass);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .ad-card {
            background: var(--glass);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            position: relative;
        }

        .ad-title { font-size: 16px; font-weight: 800; display: block; margin-bottom: 10px; color: #fff; }

        .ad-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .nav-wrapper {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 70px;
            background: #fff;
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            z-index: 2000;
        }

        .nav-link { text-decoration: none; color: #334155; text-align: center; font-size: 10px; font-weight: 700; }
        .nav-icon { font-size: 1.5em; display: block; }
        .nav-item.active .nav-link { color: var(--primary); }

    </style>
</head>
<body>

    <header class="header-ticker">
        <div class="ticker-container">
            <div class="ticker-text" id="ticker-content">أهلاً بكم في تناهيد - سحوبات فاخرة يومياً...</div>
        </div>
        <a href="#" class="view-btn">مشاهدة</a>
    </header>

    <div class="main-content">
        <div class="hero-section">
            <img src="https://files.catbox.moe/5s7y7a.png" class="logo">
            <h1 style="margin: 15px 0 5px; font-size: 28px; font-weight: 800;">تناهيد روليت</h1>
            <p style="color: #94a3b8; font-size: 13px;">الفخامة في كل سحب</p>
        </div>

        <div class="stats-row">
            <div class="stat-box"><h3>104K</h3><p>زيارة اليوم</p></div>
            <div class="stat-box"><h3 id="active-ads-count">0</h3><p>سحب نشط</p></div>
        </div>

        <div id="ads-container">
            </div>
    </div>

    <nav class="nav-wrapper">
        <div class="nav-item active"><a href="#" class="nav-link"><ion-icon name="home-outline" class="nav-icon"></ion-icon>الرئيسية</a></div>
        <div class="nav-item"><a href="#" class="nav-link"><ion-icon name="trophy-outline" class="nav-icon"></ion-icon>سحوباتي</a></div>
        <div class="nav-item"><a href="#" class="nav-link"><ion-icon name="chatbubbles-outline" class="nav-icon"></ion-icon>الدعم</a></div>
        <div class="nav-item"><a href="#" class="nav-link"><ion-icon name="settings-outline" class="nav-icon"></ion-icon>الإعدادات</a></div>
    </nav>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script>
        const dbUrl = "https://sarab-app-84448-default-rtdb.firebaseio.com";

        async function updateData() {
            try {
                const aRes = await fetch(`${dbUrl}/active_ads.json`);
                const ads = await aRes.json();
                const container = document.getElementById('ads-container');
                container.innerHTML = "";
                
                let count = 0;
                if(ads) {
                    Object.keys(ads).forEach(key => {
                        const ad = ads[key];
                        count++;
                        container.innerHTML += `
                            <div class="ad-card">
                                <span class="ad-title">${ad.title}</span>
                                <div class="ad-footer">
                                    <span>👁️ ${ad.views || 0} مشاهدة</span>
                                    <span style="color:var(--accent)">ينتهي: ${ad.end_at}</span>
                                </div>
                                <div class="animated-btn-wrapper">
                                    <a href="${ad.post_url}" class="join-btn" onclick="incView('${key}', ${ad.views || 0})">
                                        دخول السحب الفاخر 🔓
                                    </a>
                                </div>
                            </div>`;
                    });
                }
                document.getElementById('active-ads-count').innerText = count;
            } catch(e) { console.log("خطأ في جلب البيانات"); }
        }

        setInterval(updateData, 5000);
        updateData();
    </script>
</body>
</html>
