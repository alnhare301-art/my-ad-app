<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarab Roulette | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold: #e2b04a;
            --gold-dark: #996515;
            --bg-dark: #080808;
            --card-bg: rgba(20, 20, 20, 0.7);
            --neon-gold: 0 0 15px rgba(226, 176, 74, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* خلفية متحركة فخمة */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #080808 100%);
            z-index: -1;
        }

        .bg-mesh {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(at 0% 0%, rgba(226, 176, 74, 0.05) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(226, 176, 74, 0.05) 0, transparent 50%);
            filter: blur(80px);
            animation: meshMove 10s ease infinite alternate;
        }

        @keyframes meshMove {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        /* الهيدر */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(226, 176, 74, 0.1);
            position: sticky;
            top: 0; z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 45px; height: 45px;
            border-radius: 12px;
            border: 2px solid var(--gold);
            box-shadow: var(--neon-gold);
        }

        .brand-text {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* المحتوى الرئيسي */
        .container {
            padding: 25px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* بطاقة الإحصائيات الفورية */
        .live-status {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .stat-item { text-align: center; }
        .stat-val { display: block; font-size: 22px; font-weight: 900; color: var(--gold); }
        .stat-lab { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 1px; }

        /* البطاقات الملكية */
        .ad-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(226, 176, 74, 0.1);
            position: relative;
            transition: 0.4s cubic-bezier(0.2, 1, 0.2, 1);
            overflow: hidden;
        }

        .ad-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(226, 176, 74, 0.03), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .ad-card:hover::before { transform: translateX(100%); }

        .ad-card:hover {
            transform: scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .ad-title {
            font-size: 18px; font-weight: 700; margin-bottom: 15px; display: block;
        }

        /* الزر المصمم خصيصاً لك */
        .btn-luxury {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(45deg, var(--gold-dark), var(--gold));
            color: #000;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
            box-shadow: var(--neon-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-luxury:active { transform: scale(0.96); }

        /* شريط التنقل (Minimalist) */
        .nav-bar {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
        }

        .nav-btn {
            color: #555;
            font-size: 24px;
            transition: 0.3s;
            position: relative;
        }

        .nav-btn.active { color: var(--gold); }
        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 5px; height: 5px; background: var(--gold); border-radius: 50%;
        }

    </style>
</head>
<body>

    <div class="bg-animate"><div class="bg-mesh"></div></div>

    <header class="header">
        <div class="brand">
            <img src="https://files.catbox.moe/5s7y7a.png" class="brand-logo">
            <span class="brand-text">SARAB</span>
        </div>
        <div style="font-size: 12px; color: #4ade80;">● ON AIR</div>
    </header>

    <div class="container">
        <div class="live-status">
            <div class="stat-item"><span class="stat-val">12</span><span class="stat-lab">سحب نشط</span></div>
            <div class="stat-item" style="border-left: 1px solid #222; border-right: 1px solid #222; padding: 0 20px;">
                <span class="stat-val" id="user-count">4.8k</span><span class="stat-lab">مشاهدة</span>
            </div>
            <div class="stat-item"><span class="stat-val">98%</span><span class="stat-lab">نسبة الحظ</span></div>
        </div>

        <div id="feed">
            </div>
    </div>

    <nav class="nav-bar">
        <a href="#" class="nav-btn active"><ion-icon name="grid"></ion-icon></a>
        <a href="#" class="nav-btn"><ion-icon name="trophy"></ion-icon></a>
        <a href="#" class="nav-btn"><ion-icon name="notifications"></ion-icon></a>
        <a href="#" class="nav-icon"><img src="https://files.catbox.moe/5s7y7a.png" style="width: 30px; border-radius: 50%;"></a>
    </nav>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script>
        const dbUrl = "https://sarab-app-84448-default-rtdb.firebaseio.com/active_ads.json";

        async function loadContent() {
            try {
                const res = await fetch(dbUrl);
                const data = await res.json();
                const feed = document.getElementById('feed');
                feed.innerHTML = '';

                Object.keys(data).forEach(key => {
                    const item = data[key];
                    const card = `
                        <div class="ad-card">
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <span class="ad-title">${item.title}</span>
                                <span style="background: rgba(226,176,74,0.1); color: var(--gold); padding: 4px 8px; border-radius: 8px; font-size: 10px;">VIP</span>
                            </div>
                            <div style="color: #666; font-size: 12px; margin-top: 5px;">
                                ينتهي خلال: <span style="color: #bbb;">${item.end_at}</span>
                            </div>
                            <button class="btn-luxury" onclick="celebrate(this, '${item.post_url}')">
                                دُخول السحب
                                <ion-icon name="chevron-forward-outline"></ion-icon>
                            </button>
                        </div>
                    `;
                    feed.insertAdjacentHTML('beforeend', card);
                });
            } catch (e) {
                console.log("Offline or Error");
            }
        }

        function celebrate(btn, url) {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#e2b04a', '#ffffff', '#996515']
            });
            
            btn.innerHTML = "جاري التحميل...";
            setTimeout(() => {
                window.location.href = url;
            }, 1000);
        }

        // تحديث البيانات كل 10 ثواني
        setInterval(loadContent, 10000);
        loadContent();
    </script>
</body>
</html>
