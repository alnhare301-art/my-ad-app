<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA V2 - الميدان المربع المطور</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --gold2: #f0d060;
            --dark: #060606;
            --dark2: #0f0f0f;
            --card: #111111;
            --border: rgba(212,175,55,0.15);
            --red: #e53e3e;
            --green: #38a169;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark);
            color: white;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(212,175,55,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212,175,55,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper { position: relative; z-index: 1; padding: 12px; max-width: 420px; margin: 0 auto; }

        /* ===== الهيدر ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .header-brand {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold), var(--gold2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bal-wrap { text-align: left; }
        .bal-label { font-size: 9px; color: #555; letter-spacing: 1px; text-transform: uppercase; }
        .bal-amount { font-size: 18px; font-weight: 900; color: var(--gold); }

        /* ===== شريط الحالة ===== */
        .status-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info { display: flex; flex-direction: column; gap: 2px; }
        .status-state { font-size: 13px; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 6px; }
        
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; transition: background 0.3s; }
        .status-dot.waiting { background: #555; }
        .status-dot.counting { background: #f59e0b; animation: blink 0.5s infinite; }
        .status-dot.playing  { background: #10b981; animation: blink 0.3s infinite; }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .status-sub { font-size: 10px; color: #666; }

        .player-count {
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 10px;
            padding: 6px 14px;
            text-align: center;
        }
        .player-count .num { font-size: 22px; font-weight: 900; color: var(--gold); line-height: 1; }
        .player-count .lbl { font-size: 9px; color: #555; }

        /* ===== الساحة المربعة ===== */
        .arena-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            max-width: 360px;
            margin: 0 auto 12px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid rgba(212,175,55,0.3);
            box-shadow: 0 0 35px rgba(212,175,55,0.15), inset 0 0 30px rgba(0,0,0,0.8);
            background: #000;
        }

        #arenaCanvas { width: 100%; height: 100%; display: block; }

        #ball {
            position: absolute;
            width: 16px; height: 16px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #8d8d8d);
            border-radius: 50%;
            z-index: 10;
            display: none;
            box-shadow: 0 0 15px rgba(255,255,255,1), 0 0 30px rgba(212,175,55,0.5);
            top: 0; left: 0;
            transform: translate(-50%, -50%);
        }

        .countdown-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(3px);
            z-index: 20;
            flex-direction: column;
        }

        .countdown-num {
            font-size: 95px;
            font-weight: 950;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(212,175,55,0.7);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
        .countdown-sub { font-size: 12px; color: #aaa; letter-spacing: 2px; }

        /* ===== قائمة المحاربين ===== */
        .players-list {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 12px;
            max-height: 160px;
            overflow-y: auto;
        }

        .players-list-title { font-size: 10px; color: #555; letter-spacing: 1px; margin-bottom: 8px; }

        .player-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 13px;
        }

        .player-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border);
            object-fit: cover;
            background: #222;
        }

        .player-details { flex: 1; display: flex; flex-direction: column; text-align: right; }
        .p-name { color: #fff; font-weight: 600; }
        .p-username { font-size: 10px; color: #666; }

        .player-meta { text-align: left; display: flex; flex-direction: column; }
        .player-bet { color: var(--gold); font-weight: 800; font-size: 12px; }
        .player-pct { color: #888; font-size: 10px; }

        /* ===== لوحة التحكم والرهانات ===== */
        .controls { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
        .controls-title { font-size: 10px; color: #555; letter-spacing: 1px; margin-bottom: 12px; text-align: center; }
        .bet-row { display: flex; gap: 8px; margin-bottom: 12px; }

        .bet-btn {
            flex: 1; background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.15);
            color: var(--gold); padding: 8px 4px; border-radius: 10px; font-size: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }

        .bet-btn:hover { background: rgba(212,175,55,0.15); border-color: rgba(212,175,55,0.4); }
        .bet-input-wrap { position: relative; margin-bottom: 12px; }
        .bet-input-wrap::before { content: '⭐'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; z-index: 1; }

        #betInput {
            width: 100%; background: rgba(212,175,55,0.04); border: 1px solid rgba(212,175,55,0.2);
            padding: 14px 40px 14px 14px; border-radius: 12px; color: var(--gold); font-size: 22px;
            font-weight: 900; text-align: center; direction: ltr;
        }

        #joinBtn {
            width: 100%; background: linear-gradient(135deg, var(--gold), #b8960c); padding: 16px;
            border-radius: 14px; border: none; color: #000; font-weight: 900; font-size: 16px;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(212,175,55,0.25);
        }

        #joinBtn:disabled { background: #222; color: #444; cursor: not-allowed; box-shadow: none; }

        .joined-badge {
            display: none; text-align: center; padding: 12px; background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.25); border-radius: 12px; color: #34d399; font-size: 13px; font-weight: 700;
        }

        /* ===== واجهة الفائز المنبثقة ===== */
        .winner-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.97); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 16px; text-align: center;
        }

        .winner-trophy { font-size: 75px; animation: bounceIn 0.6s ease; }
        .winner-avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(212,175,55,0.4); }
        .winner-name { font-size: 26px; font-weight: 900; color: white; }
        .winner-prize { font-size: 50px; font-weight: 900; color: var(--gold); text-shadow: 0 0 35px rgba(212,175,55,0.6); }
        .winner-sub { font-size: 12px; color: #555; }

        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
        
        .admin-reset-btn {
            display: block; width: 100%; max-width: 180px; margin: 12px auto 0; background: rgba(229, 62, 62, 0.15);
            border: 1px solid var(--red); color: #ff8888; font-size: 11px; padding: 6px; border-radius: 8px; cursor: pointer; text-align: center;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div class="header">
        <div class="header-brand">ARENA V2</div>
        <div class="bal-wrap">
            <div class="bal-label">رصيدك الثابت</div>
            <div class="bal-amount" id="balDisplay">100,000 ⭐</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-info">
            <div class="status-state">
                <div class="status-dot waiting" id="statusDot"></div>
                <span id="statusLabel">جاري تهيئة الميدان...</span>
            </div>
            <div class="status-sub" id="statusSub">الرجاء الانتظار ثانية</div>
        </div>
        <div class="player-count">
            <div class="num" id="playerCount">0</div>
            <div class="lbl">لاعب</div>
        </div>
    </div>

    <div class="arena-container">
        <canvas id="arenaCanvas" width="600" height="600"></canvas>
        <div id="ball"></div>
        <div class="countdown-overlay" id="countdownOverlay">
            <div class="countdown-num" id="countdownText">10</div>
            <div class="countdown-sub">ميدان المواجهة V2</div>
        </div>
    </div>

    <div class="players-list" id="playersList">
        <div class="players-list-title">⚔️ المحاربون المسجلون بالجولة</div>
        <div style="color:#444; font-size:12px; text-align:center; padding:15px;">لا أحد في ساحة التحدي...</div>
    </div>

    <div class="controls">
        <div class="controls-title">حدد رهانك وادخل الميدان المربع</div>
        <div class="bet-row">
            <button class="bet-btn" onclick="setBet(500)">500</button>
            <button class="bet-btn" onclick="setBet(1000)">1K</button>
            <button class="bet-btn" onclick="setBet(5000)">5K</button>
            <button class="bet-btn" onclick="setBet(10000)">10K</button>
        </div>
        <div class="bet-input-wrap">
            <input type="number" id="betInput" value="1000" min="100">
        </div>
        <button id="joinBtn" onclick="joinGame()">دخول الميدان الآن ⚔️</button>
        <div class="joined-badge" id="joinedBadge">✅ تم تسجيلك بالميدان! انتظر الخصوم...</div>
    </div>

    <button class="admin-reset-btn" onclick="forceServerReset()">🛠️ تصفير فوري وإعادة تشغيل</button>

</div>

<div class="winner-overlay" id="winnerOverlay">
    <div class="winner-trophy">🏆</div>
    <img src="" class="winner-avatar" id="winnerAvatar" alt="Winner Profile">
    <div class="winner-name" id="winnerName">مجهول</div>
    <div class="winner-prize" id="winnerPrize">⭐ 0</div>
    <div class="winner-sub">جاري تهيئة وتصفير الساحة لجولة جديدة تلقائياً...</div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready(); tg.expand();
        tg.setHeaderColor('#060606'); tg.setBackgroundColor('#060606');
    }

    // تم توحيد وتصحيح رابط الـ global_v7 الفعلي ليتطابق مع قاعدة البيانات التي تستخدمها حالياً بالكامل لمنع التعليق
    const DB_PATH = "https://sarab-app-84448-default-rtdb.firebaseio.com/global_v7";
    const COUNTDOWN_FROM = 10;
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23555'><circle cx='50' cy='35' r='20'/><path d='M20,85 C20,60 80,60 80,85 Z'/></svg>";

    // لوحة الألوان الفخمة الثابتة لمنع تكرار اللون الأخضر والأرجواني عند تشابك الحسابات
    const PRESET_COLORS = ["#e53e3e", "#3182ce", "#38a169", "#805ad5", "#dd6b20", "#319795", "#d69e2e"];

    const tgUser = tg?.initDataUnsafe?.user;
    let myId = tgUser ? `tg_${tgUser.id}` : (localStorage.getItem("arena_id") || "P" + Math.floor(Math.random() * 99999));
    let myName = tgUser ? (tgUser.first_name || "مجهول") : ("محارب " + myId.slice(-3));
    let myUsername = tgUser?.username ? `@${tgUser.username}` : "@no_user";
    let myAvatar = tgUser?.photo_url || DEFAULT_AVATAR;
    localStorage.setItem("arena_id", myId);

    // تصفير الرصيد وجعله 100,000 إجبارياً لكل المستخدمين
    if(!localStorage.getItem("arena_bal_fixed_v7")) {
        localStorage.setItem("arena_bal_fixed_v7", "100000");
    }
    let myBal = parseInt(localStorage.getItem("arena_bal_fixed_v7"));
    let players = [], gameState = "waiting", isSpinning = false;
    let currentArrowAngle = 0, arrowTimer = 0;

    function savebal() { localStorage.setItem("arena_bal_fixed_v7", myBal); }
    function updateBalUI() { document.getElementById("balDisplay").innerText = myBal.toLocaleString() + " ⭐"; }
    function setBet(v) { document.getElementById("betInput").value = v; }

    function setStatus(state, label, sub) {
        const dot = document.getElementById("statusDot");
        if(dot) dot.className = "status-dot " + state;
        document.getElementById("statusLabel").innerText = label;
        document.getElementById("statusSub").innerText = sub;
    }

    // وظيفة تصفير السيرفر الإجبارية لمسح أي كاش معلق
    async function forceServerReset() {
        try {
            await fetch(`${DB_PATH}.json`, { method: "DELETE" });
            if (tg) tg.showAlert("🔄 تم تصفير كافة الحسابات المعلقة وبدء الميدان من جديد بنجاح!");
            window.location.reload();
        } catch(e) { alert("خطأ في الشبكة"); }
    }

    function drawMap(pList) {
        const canvas = document.getElementById("arenaCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 600, 600);
        ctx.fillStyle = "#0c0c0c";
        ctx.fillRect(0, 0, 600, 600);

        let total = pList.reduce((s, p) => s + p.amount, 0);
        if (total === 0) return;

        let startAngle = 0;
        pList.forEach((p, index) => {
            let ratio = p.amount / total;
            let sliceAngle = ratio * Math.PI * 2;
            let endAngle = startAngle + sliceAngle;

            // استخدام لون مميز ومختلف من مصفوفة الألوان الفخمة حسب ترتيب اللاعب
            ctx.fillStyle = PRESET_COLORS[index % PRESET_COLORS.length];
            ctx.beginPath();
            ctx.moveTo(300, 300);

            let getBoxIntersection = (angle) => {
                let cos = Math.cos(angle), sin = Math.sin(angle);
                let t1 = cos !== 0 ? (300 / Math.abs(cos)) : Infinity;
                let t2 = sin !== 0 ? (300 / Math.abs(sin)) : Infinity;
                let t = Math.min(t1, t2);
                return { x: 300 + cos * t, y: 300 + sin * t };
            };

            let ptStart = getBoxIntersection(startAngle);
            let ptEnd = getBoxIntersection(endAngle);
            ctx.lineTo(ptStart.x, ptStart.y);

            for (let s = 1; s < 8; s++) {
                let interAngle = startAngle + (sliceAngle * (s / 8));
                let ptInter = getBoxIntersection(interAngle);
                ctx.lineTo(ptInter.x, ptInter.y);
            }

            ctx.lineTo(ptEnd.x, ptEnd.y);
            ctx.closePath();
            ctx.fill();

            p.angles = { start: startAngle, end: endAngle };

            ctx.save();
            let middleAngle = startAngle + sliceAngle / 2;
            let tx = 300 + Math.cos(middleAngle) * 160;
            let ty = 300 + Math.sin(middleAngle) * 160;
            tx = Math.max(60, Math.min(540, tx));
            ty = Math.max(60, Math.min(540, ty));

            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.beginPath(); ctx.arc(tx, ty, 38, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "white";
            ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(p.name.substring(0, 8), tx, ty - 10);
            
            ctx.fillStyle = var(--gold);
            ctx.font = "bold 14px sans-serif";
            ctx.fillText(Math.round(ratio * 100) + "%", tx, ty + 12);
            ctx.restore();

            startAngle = endAngle;
        });

        if (gameState === "playing" && arrowTimer > 0) {
            ctx.save(); ctx.translate(300, 300); ctx.rotate(currentArrowAngle);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 6; ctx.lineCap = "round";
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(70, 0); ctx.lineTo(60, -10);
            ctx.moveTo(70, 0); ctx.lineTo(60, 10); ctx.stroke(); ctx.restore();
        }
    }

    function renderPlayersList(pList) {
        const el = document.getElementById("playersList");
        if (!pList.length) {
            el.innerHTML = '<div class="players-list-title">⚔️ المحاربون المسجلون بالجولة</div><div style="color:#444;font-size:12px;text-align:center;padding:15px;">لا أحد في ساحة التحدي...</div>';
            return;
        }
        let total = pList.reduce((s, p) => s + p.amount, 0);
        let html = '<div class="players-list-title">⚔️ المحاربون بميدان التحدي المربع (' + pList.length + ')</div>';
        pList.forEach(p => {
            let pct = total > 0 ? Math.round(p.amount / total * 100) : 0;
            let isMe = p.id === myId;
            html += `
            <div class="player-row" style="${isMe ? 'background:rgba(212,175,55,0.04);' : ''}">
                <img src="${p.avatar || DEFAULT_AVATAR}" class="player-avatar" onerror="this.src='${DEFAULT_AVATAR}'">
                <div class="player-details">
                    <span class="p-name">${isMe ? '⭐ ' : ''}${p.name}</span>
                    <span class="p-username">${p.username || '@no_user'}</span>
                </div>
                <div class="player-meta">
                    <span class="player-bet">${p.amount.toLocaleString()} ⭐</span>
                    <span class="player-pct">المساحة المائلة: ${pct}%</span>
                </div>
            </div>`;
        });
        el.innerHTML = html;
    }

    function runPhysics(seed) {
        if (isSpinning) return;
        isSpinning = true;

        const ball = document.getElementById("ball");
        const container = document.querySelector(".arena-container");
        const W = container.clientWidth, H = container.clientHeight;
        const scale = W / 600;

        let px = 40 + (seed * (W - 80));
        let py = 40 + ((seed * 7.7 % 1) * (H - 80));
        ball.style.left = `${px}px`; ball.style.top = `${py}px`; ball.style.display = "block";

        arrowTimer = 120;
        let finalLaunchAngle = (seed * 9.44) * Math.PI * 2;
        let speedMod = 15 + (seed * 7);
        let vx = Math.cos(finalLaunchAngle) * speedMod, vy = Math.sin(finalLaunchAngle) * speedMod;

        function frame() {
            if (arrowTimer > 0) {
                arrowTimer--; currentArrowAngle += 0.15;
                drawMap(players); requestAnimationFrame(frame); return;
            }

            px += vx; py += vy;
            if (px <= 8) { vx = Math.abs(vx); px = 9; }
            if (px >= W - 8) { vx = -Math.abs(vx); px = W - 9; }
            if (py <= 8) { vy = Math.abs(vy); py = 9; }
            if (py >= H - 8) { vy = -Math.abs(vy); py = H - 9; }

            vx *= 0.984; vy *= 0.984;
            ball.style.left = `${px}px`; ball.style.top = `${py}px`;

            if (Math.abs(vx) > 0.25 || Math.abs(vy) > 0.25) {
                requestAnimationFrame(frame);
            } else {
                let cx = px / scale, cy = py / scale;
                let finalAngleFromCenter = Math.atan2(cy - 300, cx - 300);
                if (finalAngleFromCenter < 0) finalAngleFromCenter += Math.PI * 2;

                let win = players.find(p => p.angles && finalAngleFromCenter >= p.angles.start && finalAngleFromCenter <= p.angles.end);
                if (!win) win = players[0];
                finishGame(win);
            }
        }
        requestAnimationFrame(frame);
    }

    async function finishGame(win) {
        let prize = players.reduce((s, p) => s + p.amount, 0);
        let isWinner = win.id === myId;

        document.getElementById("winnerOverlay").style.display = "flex";
        document.getElementById("winnerAvatar").src = win.avatar || DEFAULT_AVATAR;
        document.getElementById("winnerName").innerText = `الفائز هو: ${win.name}`;
        document.getElementById("winnerPrize").innerText = `+${prize.toLocaleString()} ⭐`;

        if (isWinner) {
            myBal += prize; savebal(); updateBalUI();
        }

        setTimeout(async () => {
            try {
                await fetch(`${DB_PATH}.json`, { method: "DELETE" });
            } catch(e) {}
            window.location.reload();
        }, 4000);
    }

    async function joinGame() {
        let amt = parseInt(document.getElementById("betInput").value) || 0;
        if (amt <= 0 || amt > myBal) { if (tg) tg.showAlert("الرصيد غير كافٍ أو الرهان خاطئ"); return; }

        myBal -= amt; savebal(); updateBalUI();

        let pData = {
            id: myId, name: myName, username: myUsername, avatar: myAvatar, amount: amt,
            timestamp: Date.now()
        };

        try {
            await fetch(`${DB_PATH}/players/${myId}.json`, {
                method: "PUT",
                body: JSON.stringify(pData),
                headers: { "Content-Type": "application/json" }
            });
            document.getElementById("joinBtn").style.display = "none";
            document.getElementById("joinedBadge").style.display = "block";
        } catch(e) {
            myBal += amt; savebal(); updateBalUI();
        }
    }

    async function sync() {
        try {
            const res = await fetch(`${DB_PATH}.json?nc=${Date.now()}`);
            const data = await res.json();

            if (!data || !data.players) {
                players = []; gameState = "waiting";
                drawMap([]); renderPlayersList([]);
                setStatus("waiting", "بانتظار الأبطال...", "الميدان جاهز ومصفّر تماماً");
                document.getElementById("playerCount").innerText = "0";
                return;
            }

            players = Object.values(data.players);
            gameState = data.state || "waiting";

            document.getElementById("playerCount").innerText = players.length;
            renderPlayersList(players);
            if (!isSpinning) drawMap(players);

            // [ميكانيكية تصفير التعليق التلقائي الذكي]
            if (gameState === "waiting" && players.length >= 1) {
                let firstPlayerTime = players[0].timestamp || Date.now();
                if (Date.now() - firstPlayerTime > 12000 && !isSpinning) {
                    await fetch(`${DB_PATH}.json`, { method: "DELETE" });
                    return;
                }
            }

            let alreadyIn = players.some(p => p.id === myId);
            let btn = document.getElementById("joinBtn");
            let badge = document.getElementById("joinedBadge");

            if (alreadyIn || gameState !== "waiting") {
                btn.disabled = true; btn.style.display = "none";
                badge.style.display = alreadyIn ? "block" : "none";
            } else {
                btn.disabled = false; btn.style.display = "block";
                badge.style.display = "none";
            }

            // العداد التنازلي التلقائي لبدء اللعب فوراً
            if (gameState === "counting" && data.startTime) {
                let elapsed = Math.floor((Date.now() - data.startTime) / 1000);
                let remaining = Math.max(0, COUNTDOWN_FROM - elapsed);
                document.getElementById("countdownOverlay").style.display = "flex";
                document.getElementById("countdownText").innerText = remaining;
                setStatus("counting", "استعد للبدء! " + remaining + "ث", "يتم قفل الأبواب");

                if (remaining <= 0 && myId === players[0]?.id) {
                    await fetch(`${DB_PATH}.json`, {
                        method: "PATCH",
                        body: JSON.stringify({ state: "playing", seed: Math.random() }),
                        headers: { "Content-Type": "application/json" }
                    });
                }
            } else if (gameState !== "playing") {
                document.getElementById("countdownOverlay").style.display = "none";
            }

            if (gameState === "playing" && data.seed && !isSpinning) {
                document.getElementById("countdownOverlay").style.display = "none";
                setStatus("playing", "الكرة تدور في الميدان! 🎯", "حظاً موفقاً");
                runPhysics(data.seed);
            }

            if (players.length >= 2 && gameState === "waiting" && myId === players[0]?.id) {
                await fetch(`${DB_PATH}.json`, {
                    method: "PATCH",
                    body: JSON.stringify({ state: "counting", startTime: Date.now() }),
                    headers: { "Content-Type": "application/json" }
                });
            }

            if (gameState === "waiting") {
                setStatus("waiting", "بانتظار منافسين...", `${players.length} محارب في الميدان`);
            }

        } catch(e) { console.log(e); }
    }

    updateBalUI();
    setInterval(sync, 1000);
    sync();
</script>
</body>
</html>
