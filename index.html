<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روليت سراب - نظام الكيرم المطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #0d1117; --gold: #f1c40f; --cyan: #00f2ff; --pink: #ff007a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; padding: 15px; background: #161b22; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; }
        .balance { background: #000; padding: 5px 15px; border-radius: 50px; border: 1px solid var(--gold); color: var(--gold); font-weight: 900; }

        /* ساحة اللعبة */
        .game-board { 
            position: relative; width: 300px; height: 300px; 
            margin: 30px auto; background: #1c2128; 
            border: 4px solid #30363d; border-radius: 15px; 
            overflow: hidden; transition: transform 0.5s ease;
        }

        #ball { 
            position: absolute; width: 22px; height: 22px; 
            background: #fff; border-radius: 50%; 
            box-shadow: 0 0 15px #fff, 0 0 30px var(--cyan); 
            z-index: 100; display: none; /* مخفي افتراضياً */
        }

        .countdown-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; font-weight: 900; color: white; z-index: 50;
            text-shadow: 0 0 20px rgba(0,0,0,0.8); pointer-events: none;
        }

        .controls { width: 90%; max-width: 400px; background: #161b22; padding: 20px; border-radius: 20px; text-align: center; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 18px; margin: 10px 0; text-align: center; }
        
        .btn-play { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(45deg, var(--cyan), var(--pink)); color: white; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn-play:disabled { filter: grayscale(1); opacity: 0.5; }

        #winner-msg { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            display: none; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 1000; 
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900; color: var(--cyan);">SARAB LITE</div>
        <div class="balance">⭐ <span id="balance">100,000</span></div>
    </div>

    <div id="board" class="game-board">
        <div id="ball"></div>
        <div id="countdown-num" class="countdown-overlay"></div>
        <canvas id="gameCanvas" width="300" height="300"></canvas>
    </div>

    <div class="controls">
        <div id="status-text" style="margin-bottom:10px; font-weight:bold; color:var(--gold);">انتظار اللاعبين...</div>
        <input type="number" id="bet-input" value="1000" min="100">
        <button id="join-btn" class="btn-play" onclick="joinGame()">دخول الجولة 🚀</button>
        <button onclick="clearRoom()" style="background:none; border:none; color:#444; font-size:10px; margin-top:10px; cursor:pointer;">تصفير الغرفة (للمسؤول)</button>
    </div>

    <div id="winner-msg">
        <h1 style="color:var(--gold)">انتهى السحب!</h1>
        <div id="winner-info" style="text-align:center; font-size:20px;"></div>
        <button class="btn-play" style="width:200px; margin-top:20px;" onclick="location.reload()">العودة للرئيسية</button>
    </div>

    <script>
        const DB_BASE = "https://sarab-app-84448-default-rtdb.firebaseio.com/game_v3";
        let myId = "ID_" + Math.floor(Math.random() * 1000);
        let balance = parseInt(localStorage.getItem('sarab_bal')) || 100000;
        let players = [];
        let currentState = "waiting";
        let animationStarted = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ball = document.getElementById('ball');

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            localStorage.setItem('sarab_bal', balance);
        }
        updateUI();

        async function sync() {
            try {
                const res = await fetch(`${DB_BASE}.json`);
                const data = await res.json();
                if (!data) { players = []; renderBoard(); return; }

                players = data.players ? Object.values(data.players) : [];
                currentState = data.state || "waiting";

                // تحديث النصوص
                if (currentState === "waiting") {
                    document.getElementById('status-text').innerText = `المشاركون: (${players.length}/2)`;
                    document.getElementById('countdown-num').innerText = "";
                }

                // بدء العد التنازلي إذا اكتمل العدد
                if (players.length >= 2 && currentState === "waiting") {
                    if (players[0].id === myId) startCountdownAction();
                }

                if (currentState === "counting" && data.timer !== undefined) {
                    document.getElementById('countdown-num').innerText = data.timer;
                }

                // بدء الحركة
                if (currentState === "playing" && !animationStarted) {
                    runPhysics(data.seed || 0.5);
                }

                renderBoard();
            } catch (e) { console.log("Sync Error"); }
        }

        function renderBoard() {
            const total = players.reduce((s, p) => s + p.amount, 0);
            ctx.clearRect(0, 0, 300, 300);
            if (total === 0) { ctx.fillStyle = "#1c2128"; ctx.fillRect(0,0,300,300); return; }
            let currX = 0;
            players.forEach(p => {
                const w = (p.amount / total) * 300;
                ctx.fillStyle = p.color;
                ctx.fillRect(currX, 0, w, 300);
                currX += w;
            });
        }

        async function joinGame() {
            const amt = parseInt(document.getElementById('bet-input').value);
            if (amt > balance) return alert("رصيدك ناقص");
            
            balance -= amt;
            updateUI();
            document.getElementById('join-btn').disabled = true;

            const pData = { id: myId, amount: amt, color: `hsl(${Math.random()*360}, 70%, 50%)`, name: "لاعب " + myId };
            await fetch(`${DB_BASE}/players/${myId}.json`, { method: 'PUT', body: JSON.stringify(pData) });
        }

        async function startCountdownAction() {
            await fetch(`${DB_BASE}/state.json`, { method: 'PUT', body: JSON.stringify("counting") });
            let time = 5;
            let inv = setInterval(async () => {
                await fetch(`${DB_BASE}/timer.json`, { method: 'PUT', body: JSON.stringify(time) });
                time--;
                if (time < 0) {
                    clearInterval(inv);
                    await fetch(`${DB_BASE}.json`, { method: 'PATCH', body: JSON.stringify({ state: "playing", seed: Math.random() }) });
                }
            }, 1000);
        }

        function runPhysics(seed) {
            animationStarted = true;
            ball.style.display = "block";
            document.getElementById('countdown-num').innerText = "";
            
            let px = 150, py = 150;
            let vx = (seed * 15) + 5;
            let vy = (1 - seed) * 15 + 5;
            let fric = 0.985;

            function step() {
                px += vx; py += vy;
                if (px <= 0 || px >= 278) vx *= -1;
                if (py <= 0 || py >= 278) vy *= -1;
                vx *= fric; vy *= fric;
                
                ball.style.left = px + 'px';
                ball.style.top = py + 'px';

                if (Math.abs(vx) > 0.2) {
                    requestAnimationFrame(step);
                } else {
                    finish(px);
                }
            }
            step();
        }

        async function finish(finalX) {
            const total = players.reduce((s, p) => s + p.amount, 0);
            let currX = 0;
            let winner = players[0];
            players.forEach(p => {
                const w = (p.amount / total) * 300;
                if (finalX >= currX && finalX <= currX + w) winner = p;
                currX += w;
            });

            document.getElementById('winner-info').innerHTML = `الفائز هو: <b style="color:${winner.color}">${winner.name}</b><br>الجائزة: ${total} ⭐`;
            document.getElementById('winner-msg').style.display = "flex";

            if (winner.id === myId) {
                balance += total;
                updateUI();
                confetti();
            }

            if (players[0].id === myId) {
                setTimeout(() => { fetch(`${DB_BASE}.json`, { method: 'DELETE' }); }, 8000);
            }
        }

        async function clearRoom() {
            await fetch(`${DB_BASE}.json`, { method: 'DELETE' });
            location.reload();
        }

        setInterval(sync, 1000);
    </script>
</body>
</html>
